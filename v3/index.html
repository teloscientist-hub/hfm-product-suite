<title>Human First Media | AI systems your company still runs a year from now</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap">
<style>
:root{
  --ground:#FFFBF9;
  --surface:#FFFFFF;
  --card:#FFFBF9;
  --ink:#000000;
  --body:#70666A;
  --rule:#E8DFDC;
  --deep:#222639;
  --deep-ink:#FFFFFF;
  --deep-body:#B9B4C4;
  --red:#EE2A52;
  --purple:#8F5ED8;
  --cyan:#3CC2DB;
  --gold:#F1B900;
  --teal:#1F7A8C;
  --navy:#222639;
  --accent:#EE2A52;
  --accent-ink:#FFFFFF;
  --wash:rgba(238,42,82,.07);
  --shell:1180px;
  --text:1px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#1A1D2B;
    --surface:#222639;
    --card:#262A3E;
    --ink:#FFFFFF;
    --body:#B4AFB8;
    --rule:#343850;
    --deep:#14161F;
    --deep-ink:#FFFFFF;
    --deep-body:#B9B4C4;
  }
}
:root[data-theme="dark"]{
  --ground:#1A1D2B;
  --surface:#222639;
  --card:#262A3E;
  --ink:#FFFFFF;
  --body:#B4AFB8;
  --rule:#343850;
  --deep:#14161F;
  --deep-ink:#FFFFFF;
  --deep-body:#B9B4C4;
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--body);
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.8;font-weight:400;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{color:var(--ink);margin:0;text-wrap:balance;line-height:1.25;font-weight:600}
p{margin:0}
a{color:inherit}
.shell{max-width:var(--shell);margin:0 auto;padding:0 28px}
.narrow{max-width:760px}

/* ---------- nav ---------- */
header.top{
  position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--ground) 92%,transparent);
  backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid var(--rule);
}
.topin{max-width:var(--shell);margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:26px}
.mark{font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);text-decoration:none;line-height:1.3;white-space:nowrap}
.mark span{color:var(--red)}
.navlinks{margin-left:auto;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.navlinks a{font-size:14px;text-decoration:none;color:var(--body);white-space:nowrap}
.navlinks a:hover,.navlinks a.on{color:var(--ink)}
.tglbtn{border:1px solid var(--rule);background:none;color:var(--body);font:inherit;font-size:12px;
  border-radius:999px;padding:5px 12px;cursor:pointer}
.tglbtn:hover{color:var(--ink)}

/* ---------- buttons ---------- */
.btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;font-size:16px;font-weight:400;
  border-radius:10px;padding:15px 30px;border:none;cursor:pointer;font-family:inherit;line-height:1.4}
.btn:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold)}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--rule)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);filter:none}
.btnrow{display:flex;gap:14px;flex-wrap:wrap;align-items:center}

/* ---------- type roles ---------- */
.eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--accent);margin:0 0 14px}
.h-hero{font-size:clamp(32px,5.2vw,54px);font-weight:700;letter-spacing:-.015em}
.h-sec{font-size:clamp(24px,3vw,34px);font-weight:600;letter-spacing:-.01em}
.h-sub{font-size:20px;font-weight:600}
.lede{font-size:clamp(18px,2.1vw,21px);line-height:1.75;color:var(--body);font-weight:400}
.small{font-size:14px;line-height:1.7}
.stack>*+*{margin-top:18px}

/* ---------- sections ---------- */
section{padding:76px 0}
section.tight{padding:52px 0}
.band{background:var(--surface);border-block:1px solid var(--rule)}
.dark{background:var(--deep);color:var(--deep-body)}
.dark h1,.dark h2,.dark h3,.dark h4{color:var(--deep-ink)}

/* ---------- hero : split, text left, art right (matches hfm) ---------- */
.hero{padding:70px 0 60px;position:relative;overflow:hidden}
.hero .rule{width:64px;height:4px;background:var(--accent);border-radius:2px;margin:0 0 26px}
.heroGrid{display:grid;grid-template-columns:minmax(0,635px) minmax(0,430px);gap:44px;align-items:center}
@media(max-width:1020px){.heroGrid{grid-template-columns:1fr;gap:34px;align-items:start}}
.heroArt{width:100%;max-width:430px;justify-self:end}
@media(max-width:1020px){.heroArt{max-width:340px;justify-self:start}}
.heroFacts{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:52px;
  border-top:1px solid var(--rule);padding-top:26px}
@media(max-width:700px){.heroFacts{grid-template-columns:1fr;gap:18px}}
.fact b{display:block;color:var(--ink);font-size:26px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.fact span{font-size:13.5px;line-height:1.6;display:block}

/* ---------- tier cards : icon on top, hfm card geometry ---------- */
.tiergrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:20px}
.tcard{background:var(--card);border-radius:5px;padding:30px 10px 26px 30px;
  text-decoration:none;display:flex;flex-direction:column;gap:11px;position:relative;
  transition:transform .16s ease,background .16s ease}
.tcard:hover{transform:translateY(-4px)}
.tcard .ic{width:120px;height:120px;margin-bottom:6px;display:block}
.tcard .tnum{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--body);font-variant-numeric:tabular-nums}
.tcard h3{font-size:20px;font-weight:600;color:var(--tc);padding-right:20px}
.tcard p{font-size:15px;line-height:1.7;padding-right:20px}
.tcard .cnt{margin-top:auto;padding-top:14px;font-size:13px;color:var(--tc);font-weight:500}

/* ---------- solution cards ---------- */
.solgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.scard{background:var(--card);border:1px solid var(--rule);border-radius:5px;padding:24px 22px;
  text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:border-color .16s ease,transform .16s ease}
.scard:hover{border-color:var(--accent);transform:translateY(-2px)}
.scard .sn{font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--accent);font-variant-numeric:tabular-nums}
.scard h4{font-size:17px;font-weight:600}
.scard p{font-size:14.5px;line-height:1.65}
.scard .meta{margin-top:auto;padding-top:10px;font-size:12.5px;border-top:1px solid var(--rule);
  display:flex;gap:10px;flex-wrap:wrap;color:var(--body)}

/* ---------- steps : hanging number, hfm's 100px left offset ---------- */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:34px 30px}
.step{position:relative;padding:10px 20px 10px 100px;min-height:96px}
.step .n{position:absolute;left:0;top:2px;font-size:44px;font-weight:700;line-height:1;
  color:var(--stepc,var(--red));font-variant-numeric:tabular-nums;opacity:.9}
.step .n::after{content:".";}
.step h4{font-size:18px;margin-bottom:8px}
.step p{font-size:14.5px;line-height:1.7}

/* ---------- prose blocks ---------- */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:60px}
@media(max-width:820px){.two{grid-template-columns:1fr;gap:32px}}
.deck{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.pt h4{font-size:17px;margin-bottom:7px}
.pt p{font-size:14.5px;line-height:1.7}
.pt{border-top:2px solid var(--accent);padding-top:16px}

ul.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
ul.ticks li{padding-left:26px;position:relative;font-size:15px;line-height:1.7}
ul.ticks li::before{content:"";position:absolute;left:0;top:.62em;width:9px;height:9px;border-radius:2px;background:var(--accent)}

.quote{border-left:3px solid var(--accent);padding:2px 0 2px 24px;font-size:17px;line-height:1.75;color:var(--ink);font-weight:500}
.quote cite{display:block;margin-top:12px;font-size:13.5px;font-style:normal;font-weight:400;color:var(--body)}

.vbar{background:var(--deep);color:#fff;font-size:12.5px;padding:8px 0;text-align:center;letter-spacing:.02em}
.vbar a{color:#fff;text-decoration:underline;text-underline-offset:2px}
.vbar b{font-weight:600}
.band-line{font-size:15px;margin-top:18px;color:var(--body)}
.band-line b{color:var(--ink);font-weight:600}
.devtag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;
  padding:2px 8px;border-radius:999px;background:var(--rule);color:var(--body)}
.pill{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
  padding:5px 11px;border-radius:999px;background:var(--wash);color:var(--accent)}

/* ---------- breadcrumb ---------- */
.crumb{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.crumb a{text-decoration:none;color:var(--body)}
.crumb a:hover{color:var(--accent)}
.crumb .sep{opacity:.5}

/* ---------- cta band ---------- */
.ctaband{background:var(--deep);color:var(--deep-body);padding:64px 0}
.ctaband h2{color:#fff;margin-bottom:14px}
.ctaband p{max-width:620px}
.ctaband .btnrow{margin-top:28px}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--rule);padding:44px 0 56px;font-size:13.5px}
.fgrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:36px}
@media(max-width:760px){.fgrid{grid-template-columns:1fr;gap:26px}}
footer a{display:block;text-decoration:none;color:var(--body);padding:3px 0}
footer a:hover{color:var(--accent)}
footer h5{color:var(--ink);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 10px;font-weight:600}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:420px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
th{color:var(--ink);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}

:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
.chain{display:grid;gap:0;margin:0}
.chainrow{display:grid;grid-template-columns:92px minmax(0,1fr);gap:24px;padding:22px 0;border-top:1px solid var(--rule);align-items:start}
.chainrow:last-child{border-bottom:1px solid var(--rule)}
.chainrow .sn2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--sc);padding-top:5px}
.chainrow h3{font-size:20px;font-weight:600;margin-bottom:6px}
.chainrow h3 a{text-decoration:none}
.chainrow h3 a:hover{color:var(--sc)}
.chainrow p{font-size:15px;line-height:1.7}
.chainrow .cnt2{margin-top:9px;font-size:13px;color:var(--sc);font-weight:500}
@media(max-width:660px){.chainrow{grid-template-columns:1fr;gap:8px}}
.gate{background:var(--wash);border-left:3px solid var(--accent);padding:18px 22px;border-radius:0 5px 5px 0;font-size:15px;line-height:1.75}
.gate b{color:var(--ink)}
.countbar{display:flex;gap:34px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:22px;margin-top:34px}
.countbar div b{display:block;color:var(--ink);font-size:26px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.countbar div span{font-size:13.5px}
.nope{border:1px solid var(--rule);border-radius:5px;padding:22px 24px;background:var(--card)}
.nope h4{font-size:16px;margin-bottom:7px}
.nope p{font-size:14.5px;line-height:1.7}
.srail{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.srail a{font-size:12.5px;text-decoration:none;padding:5px 12px;border-radius:999px;border:1px solid var(--rule);color:var(--body);white-space:nowrap}
.srail a:hover{border-color:var(--accent);color:var(--accent)}
.srail a.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media(max-width:820px){
  .topin{flex-wrap:wrap;gap:10px 18px;padding:12px 20px}
  .navlinks{margin-left:0;width:100%;gap:12px 16px;row-gap:8px}
  .navlinks a{font-size:13px}
  .mark{font-size:14px}
}
@media(max-width:540px){
  .shell{padding:0 20px}
  .countbar{gap:20px}
}
html,body{overflow-x:hidden}
</style>

<script>
const STAGES=[{"id": "ceiling", "n": "Stage 1", "name": "Find the ceiling", "c": "var(--cyan)", "cw": "rgba(60,194,219,.10)", "tag": "Two days. One constraint named. Two refused.", "promise": "Before you buy anything, find out which constraint is actually holding your AI work back, and which two are not.", "lede": "Most AI budgets are spent on the wrong ceiling. A team buys a better model when the problem is that nobody can find last quarter's work, or rebuilds retrieval when the real limit is that no one can say which outputs were any good. This stage measures three ceilings, names the one that binds, and tells you the trigger that would make each of the others matter later.", "why": [{"h": "The wrong ceiling is expensive and quiet", "p": "Money spent on a constraint that was not binding does not fail loudly. It produces a system that works slightly better and a team that concludes AI does not do much."}, {"h": "A refusal is the only credible part of an audit", "p": "Any supplier will tell you all three need work. We name one and decline the other two in writing, which is the whole reason the ranking is worth anything."}, {"h": "You find out what working with us is like", "p": "Two days, a ranked finding with the measurements attached, and one uncomfortable sentence you did not want to hear."}], "how": "We measure rather than interview. Three ceilings get a number each, your own material goes through the same four measurements in front of you, and the first test is free and takes a minute: ask three people to produce a link to something they built more than a month ago, and time it.", "units": ["ceiling-read", "flatness-audit"]}, {"id": "ground", "n": "Stage 2", "name": "Ground it", "c": "var(--navy)", "cw": "rgba(34,38,57,.08)", "tag": "What the system reads, and whether it can find anything", "promise": "An AI system is only as good as what it can reach. This is the layer underneath every assistant you will ever run.", "lede": "Both of the teachers whose material we work from could not find their own work in the same week. One had shipped a file six weeks earlier and could not locate it. That is not an unusual failure, it is the normal state of a company that has been producing for a few years, and it is invisible until you point a model at it.", "why": [{"h": "Assistants that re-learn the company every session", "p": "Without a persistent layer, every conversation starts from nothing and the same context gets pasted in forty times a week."}, {"h": "You are building on ground that moves", "p": "State accumulated inside a vendor's product leaves with that vendor. Processes written around a product name break when the product does."}, {"h": "Deletion is part of the fix and clients resist it", "p": "Retrieval gets worse as volume grows. The remediation that works involves removing things, which is the phase every client wants to skip."}], "how": "A census first, then a staleness sample, then a utilisation check. We move accumulated state out of vendor products, rewrite processes to name capabilities rather than product names, and install an adoption gate with seven questions so the next tool has to earn its place. Where there is enough to justify it, we build the knowledge layer itself with ingest, query and lint running on a schedule.", "units": ["substrate-audit", "retrieval-fix", "knowledge-vault"]}, {"id": "judgment", "n": "Stage 3", "name": "Teach it judgment", "c": "var(--red)", "cw": "rgba(238,42,82,.07)", "tag": "The part nobody else sells", "promise": "Take the judgment of the one person who can tell good from mediocre, and turn it into something the rest of the team can run without them.", "lede": "Every company has someone who can look at a draft and say what is wrong with it in four seconds. That person is a bottleneck, and no amount of prompt engineering replaces them, because the problem was never the instructions. It is that the system has no examples of what good looks like here, no record of the corrections that person keeps making, and nothing that grades a draft before a human has to.", "why": [{"h": "Better prompts is the wrong theory and we can kill it in a minute", "p": "Run ten outputs from your own prompt and measure how similar they are to each other. Convergence is not a prompting problem."}, {"h": "The second one costs a fraction of the first", "p": "The first system takes weeks to dial in. The next one takes days, because the method transfers even though the content does not."}, {"h": "This is the only stage where all four parts are genuinely AI", "p": "Taste, pairs, rules and a judge. Remove the model and there is no engagement left, which is not true of most things sold as AI work."}], "how": "Four artifacts, in order, and your people do the mining. A taste file of your own best work with the reason attached to each piece. A pairs file of before and after with the principle named. A rules file split into hard rules and tendencies, where a tendency is only promoted to a rule after three appearances or the owner's explicit say-so. Then a judge that grades before anyone reads a draft, and a correction loop with an owner and a cadence.", "units": ["taste-file", "pairs-mining", "rules-and-judge", "correction-loop"]}, {"id": "production", "n": "Stage 4", "name": "Put it to work", "c": "var(--purple)", "cw": "rgba(143,94,216,.10)", "tag": "Three production systems that are genuinely AI", "promise": "The output work where the model is doing the making, not assisting somebody who is.", "lede": "Most things sold as AI production are a person doing their old job with a faster draft. These three are not. Generated video, cloned delivery voices and an authority programme measured by an agent that queries answer engines and scores whether you were cited. Each one produces something that did not previously exist at a price that made sense weekly.", "why": [{"h": "Per-asset cost is what decides whether you do it weekly", "p": "Video that costs too much per asset gets made quarterly, which means it never compounds."}, {"h": "Your citation rate is measurable and almost nobody measures it", "p": "Answer engines either name you or they do not. A monthly audit across a fixed query set turns that from a feeling into a number with a trend."}, {"h": "Volume without a gate is a liability", "p": "Each of these ships with the judge from stage three attached, or we do not ship it."}], "how": "Text-based editing so a video is cut by editing its transcript. Three delivery voices rather than one, because a whisper for a hook and an authoritative read for a call to action are different jobs. A fixed query set of brand and category questions, scored before and after, monthly. And the step almost everyone skips: adding grain and texture back into generated footage, which is why most AI video reads as fake.", "units": ["video-animation", "voice-presenter", "authority-aeo"]}, {"id": "governance", "n": "Stage 5", "name": "Run it safely", "c": "var(--teal)", "cw": "rgba(31,122,140,.10)", "tag": "Seven of our nineteen engagements are about not shipping something wrong", "promise": "Where the systems live, who owns each one, and what is not allowed to leave the building.", "lede": "Every competitor's chain ends at production. Ours does not, and this is the largest stage we sell. A company running twelve automations with no accountability model does not have an AI capability, it has twelve things that will each break once and never be fixed, and at least one of them will publish something it should not have.", "why": [{"h": "Every agent needs one named human owner", "p": "Not a team. A person. Accountability is the one thing that cannot be automated, and a roster without names is a roster nobody reads."}, {"h": "No agent publishes", "p": "Every output goes to a human before it ships. This is a rule, not a preference, and it is the difference between a capability and an incident."}, {"h": "A standard nobody enforces is a preference", "p": "We install the check that runs at delivery time. We have read four shipped skill packages from a competitor whose craft was high and which failed every mark of a basic standard, because nothing was checking."}], "how": "A build standard your own people are trained to work to, so the assistants are theirs rather than ours. An org chart for automated work with one named owner per agent, a scheduled-task calendar, and risk marked in the roster rather than in somebody's memory. And a claims gate: what the business will and will not assert, decided explicitly, then installed as rules in the judge where there is a pipeline and a named human gate where there is not.", "units": ["skill-authoring", "skill-server", "agentic-email", "production-workflow", "assistant-build", "ai-team-design", "claims-check"]}];
const U={"ceiling-read": {"s": "ceiling", "name": "The Ceiling Read", "time": "2 days", "who": "CTO, COO", "promise": "Three constraints measured. One named as the thing actually holding you back. Two refused in writing.", "problem": "You have AI work underway and it is not compounding. Somebody wants a better model, somebody wants a vector database, somebody wants more seats. Each argument is plausible and none of them is measured, so the budget goes to whoever presented last.", "cost": "Money aimed at a constraint that was not binding produces a system that works slightly better. Nobody calls that a failure, so the next round of spending is aimed the same way, and eighteen months later the conclusion inside the company is that AI does not do much here.", "hard": "Three ceilings look identical from the inside. A team that cannot find prior work and a team whose model is too small both report the same symptom, which is that the output is disappointing. Separating them takes measurement against each ceiling independently, and the discipline to say two of the three are not the problem when a client would happily pay to fix all three.", "work": ["We run the author test first, in the room, and it takes a minute: three people, produce the link to something you built more than a month ago, timed", "Platform, retrieval and compute measured separately, each with a number and a stated method", "A unit economics read alongside, because it decides whether anything behind this is worth building", "We rank them with you present, name the binding one, and write down the trigger that would make each of the others matter later"], "get": ["The three ceilings with a measurement each and the method stated", "One named as binding, with the evidence", "Two named as dormant, each with the condition that would change that", "The author test result, which is usually the uncomfortable one", "A written refusal to remediate the two we did not name"], "money": "The credit against whatever follows makes this close to free if you proceed. The value is in the two you do not buy."}, "flatness-audit": {"s": "ceiling", "name": "The Flatness Audit", "time": "1 day", "who": "CMO, head of content", "promise": "Four measurements on your own prompt and your own outputs, run in front of you, that settle the better-prompts argument in a minute.", "problem": "You are using AI for customer-facing text and it all sounds the same. It is not wrong and it is not embarrassing. It is flat, and every attempt to fix it has been a longer prompt. The internal theory is that somebody needs to get better at prompting.", "cost": "The prompting theory is comfortable because it is always one more iteration away from working. Meanwhile the team either stops using the tool for anything that matters, which wastes the investment, or keeps shipping flat work, which costs more.", "hard": "Nobody can diagnose this by reading the output, because each piece looks acceptable on its own. The defect only shows as a distribution across the whole set. Building measurements a client will accept, on their own material rather than a demonstration, is what makes the finding land rather than get argued with.", "work": ["We take your live prompt, unedited, and generate ten outputs from it", "We measure convergence across the ten, which is the test that kills the prompting theory", "Three of your best human-written pieces scored against the same rubric", "The four measurements published with the disagreements shown, not smoothed over"], "get": ["The convergence number on your own prompt", "Your best human work scored on the same scale, for the gap", "The four measurements with their methods, so your team can re-run them", "A named recommendation on whether stage three is worth it for you, including when it is not"], "money": "It is the cheapest way to find out whether a judgment pipeline would pay, and it is designed to be able to say no."}, "substrate-audit": {"s": "ground", "name": "The Substrate Audit", "time": "3 weeks", "who": "CTO, head of operations", "promise": "Move what matters out of other people's products, and rewrite your processes so the next vendor change is a swap rather than a rebuild.", "problem": "Your working state lives inside tools you do not own. Processes are written around product names. When a vendor changes its pricing, its API or its mind, the work stops while somebody figures out what to do, and the answer is usually to absorb it.", "cost": "Each individual lock-in is small and reasonable. The aggregate is a business whose operating capability is a function of six suppliers' roadmaps, and the bill arrives as an unplanned migration in a quarter you needed for something else.", "hard": "Everybody knows vendor lock-in is bad and almost nobody can act on it, because the work is unglamorous and the trigger is always in the future. The part that needs outside help is the census: finding where state actually accumulated, which is never where the architecture diagram says.", "work": ["A census of where working state lives, by system, including the places nobody nominated", "A staleness sample and a utilisation check, so you learn what you pay for and do not use", "Accumulated state moved out of vendor products into somewhere you own", "Processes rewritten to name capabilities rather than products", "An adoption gate with seven questions, installed, so the next tool has to answer them"], "get": ["The census, with state located by system", "A utilisation list naming what you pay for and do not use", "Your state, in a store you control", "Processes rewritten against capabilities", "The adoption gate, running, with an owner"], "money": "The utilisation list usually pays for the engagement on its own. The rest is the migration you do not have to do next year."}, "retrieval-fix": {"s": "ground", "name": "The Retrieval Fix", "time": "3 weeks", "who": "COO, head of knowledge", "promise": "Make your own work findable, including the part where we remove things.", "problem": "Your people cannot find what your people made. The search box returns forty results and none of them is the one. The document exists, somebody wrote it, and it is faster to write it again than to find it, so that is what happens.", "cost": "Rework is the visible half. The invisible half is that decisions get made without the prior analysis, the same question gets answered four different ways by four people, and every assistant you point at this estate inherits the mess and answers confidently from the wrong version.", "hard": "Retrieval gets worse as volume grows, so the instinct is to add better search. The fix that works involves deletion and consolidation, which is the phase clients cut, because removing things feels like losing them and nobody wants to be the person who decided.", "work": ["A full census of the estate, content-sniffed rather than trusted by file extension", "Duplicate and near-duplicate detection with the method written down, because the naive version returns zero and the naive version is wrong", "Consolidation, and the deletion phase, with a retirement folder rather than a delete key", "Conventions installed: where things go, how they are named, and what gets read first"], "get": ["The census, with the real counts and the recipe that produced them", "Duplicates and near-duplicates identified and resolved", "A retirement folder holding everything removed, so nothing is lost", "Naming and placement conventions, written down", "A root index that gets read before anything else"], "money": "Measure it as rework hours removed. The number your own team produces after a month is the one worth quoting back."}, "knowledge-vault": {"s": "ground", "name": "The Knowledge Vault", "time": "3 weeks", "who": "COO, head of operations", "promise": "A knowledge layer with three operations running on a schedule, so your assistants stop re-learning the company every session.", "problem": "Institutional knowledge lives in the heads of four people and in the chat history of a tool nobody exports. Every assistant starts from nothing. The same context gets pasted into a chat window forty times a week, slightly differently each time.", "cost": "The obvious cost is the pasting. The real one arrives when one of the four people leaves and takes a body of unwritten judgment with them, and the second one is that every AI output is built from whatever context that operator happened to paste that morning.", "hard": "Most knowledge bases fail the same way: they get built, they get stale, nobody notices, and eventually people stop trusting them and go back to asking a person. The part that makes this survive is the third operation, and it is the one nobody builds.", "work": ["Six foundation files, built from what your business actually holds rather than a template", "Ingest: a source arrives, gets read, and updates the pages it touches. Not summarised, integrated", "Query: a question answered across pages with citations, and substantial answers saved back", "Lint: a scheduled health check for contradictions, stale claims, orphan pages and missing frontmatter", "A weekly ten-minute update, seven questions, with a named owner"], "get": ["The vault, with the six foundation files populated", "Ingest, query and lint running on a schedule", "A contradiction and staleness report, monthly", "File conventions enforced rather than documented", "The weekly update cadence, with an owner"], "money": "Lint is the part to judge it on. A staleness detector for your own knowledge base is something almost nobody has built and every company past four years old needs."}, "taste-file": {"s": "judgment", "name": "Taste File Build", "time": "1 week", "who": "The owner of the standard", "promise": "Five to ten pieces of your own best work, each with the reason it is good written down beside it.", "problem": "The person who can tell good from mediocre cannot explain it in a way anyone else can apply. The style guide exists and does not help, because it describes preferences rather than showing judgment.", "cost": "Every draft routes through one person. That person becomes the constraint on volume, and when they are on holiday the standard drops in a way nobody can name until a client mentions it.", "hard": "Asking someone for their best work gets you their most recent work. Getting the actual set takes pushing on each one with the same question: what would the mediocre version of this have looked like, and why is this not that. That question is where the judgment is, and people cannot answer it in the abstract.", "work": ["We pull candidates from your archive rather than asking you to remember", "The owner picks five to ten and we sit with them while they say why, one at a time", "For each piece, the mediocre-version question answered explicitly", "The file kept free of anything the system itself produced, from day one"], "get": ["The taste file, five to ten pieces with reasons", "The mediocre-version answer for each", "A written rule on what may enter the file and who decides", "The contamination rule, because a system trained on its own output degrades politely and invisibly"], "money": "This is the first of four artifacts and the cheapest place to find out whether your expert will actually engage. If they will not, the rest does not work and we say so here."}, "pairs-mining": {"s": "judgment", "name": "Pairs Mining", "time": "2 weeks", "who": "The owner, plus whoever does the correcting", "promise": "Ten to fifteen before-and-after pairs from your own archive, with the principle named on each one.", "problem": "Your expert corrects the same things over and over. Each correction lives in one document and reaches nobody. The next draft makes the same mistake and gets the same note.", "cost": "Correction is the most expensive hour in the building and it is spent repeatedly on the same defect. Worse, the corrections are the most valuable training material you own and they are being thrown away as a byproduct of the review process.", "hard": "A pair is not a before and an after. It is a before, an after, and the principle that connects them, stated generally enough to apply to the next piece. Extracting that third part is the work, and it has to come from the person who made the correction rather than from someone reconstructing it afterwards.", "work": ["Your team mines the archive, not us. This is deliberate and it is the only way the rules end up yours", "Ten to fifteen pairs selected for range rather than for severity", "The owner names the principle on each one, in their own words", "We sit between sessions and sort the principles into candidates for hard rules and candidates for tendencies"], "get": ["The pairs file, ten to fifteen worked examples", "A named principle on each pair", "A first split into hard rules and tendencies", "The mining method, so your team extends the file without us"], "money": "Set as homework between two sessions. The second session is where the value is, because the map comes back and gets corrected."}, "rules-and-judge": {"s": "judgment", "name": "Rules File and Judge Install", "time": "3 weeks", "who": "The owner, plus an engineer", "promise": "A rules file split into hard rules and tendencies, and a judge that grades every draft before a person reads it.", "problem": "You have a standard and nothing enforces it. Review happens at the end, by a senior person, on work that has already been written, which is the most expensive possible moment to find a problem.", "cost": "Enforcement at review time means the correction cost scales with volume. Double the output and you double the senior hours spent on it, which is the opposite of what the AI investment was supposed to do.", "hard": "Most rules files fail in one of two ways. They are too loose to enforce, or they are so tight that a draft can obey every rule and still fail the job entirely. Both are fixed by the same thing, which is a single binary question at the top that outranks every rule beneath it.", "work": ["The job question written first: one binary pass-or-fail test at the top of the file", "Rules split into hard rules and tendencies, each tagged as belonging to the person or to the format", "Promotion discipline installed: a tendency becomes a hard rule on three appearances or the owner's explicit say-so, never on the system's inference", "The blind test run on every candidate rule: versions with and without, read cold, ranked by feel", "The judge installed in the pipeline, grading before anyone sees a draft"], "get": ["The rules file, split, tagged, and with the job question at the top", "The judge running, with its grades visible", "The promotion rule, written, with a named ratifier", "The blind test as a standing method for anything proposed later"], "money": "Measure edit time per piece before and after. That is the number, it is yours, and you already have the before."}, "correction-loop": {"s": "judgment", "name": "The Correction Loop", "time": "Monthly", "who": "The owner", "promise": "The standing cadence that stops the system drifting, which is the phase every client wants to cut.", "problem": "The pipeline works on the day it is installed. Six months later the outputs have drifted, the rules file has accumulated things nobody ratified, and the taste file has quietly filled up with the system's own output.", "cost": "Drift is not visible from inside. The outputs get worse by a degree a month and the team calibrates to them, so the first honest signal is external and late.", "hard": "Every engagement in this stage says the same thing about this phase: it is the one clients cut and it is the one that decides whether any of the rest holds. The work is not difficult. Doing it on a schedule when nothing looks wrong is difficult, which is why it needs an owner and a date rather than an intention.", "work": ["Red pen on a schedule, on sampled output, even when nothing looks wrong", "The rules file audited quarterly, with anything unratified removed", "The taste file checked for contamination, because corpus poisoning is real and the system does it politely", "Only the owner ratifies. Not the team, not the system, not us"], "get": ["A monthly cadence with a named owner and a date", "A quarterly rules audit with a written outcome", "A contamination check on the taste file", "A drift report you can read in five minutes"], "money": "This is the retainer, and we will tell you at the point of sale that it is the phase you will want to cut and the one that decides whether the build holds."}, "video-animation": {"s": "production", "name": "AI Video and Animation Pipeline", "time": "4 weeks", "who": "Head of content, creative director", "promise": "A generated video pipeline that costs little enough per asset to run weekly rather than quarterly.", "problem": "Video is the format that works and the one you make least, because each asset costs enough that it has to be justified individually. So it gets made for launches and never for the ordinary weeks in between.", "cost": "The compounding happens in the ordinary weeks. A channel fed quarterly never builds the audience that makes the launch work, so the launch underperforms and the next video budget is harder to justify.", "hard": "Generated video reads as fake for reasons that are specific and fixable, and almost nobody fixes them because the fixes are in post rather than in the prompt. Grain, texture and eye sharpening are the difference between something you can publish and something that gets commented on for the wrong reason.", "work": ["The generation formula built against your material, not a demo", "Scripting conventions that steer delivery rather than only supplying words", "The post pass installed: grain through a raw filter, texture and clarity raised, eyes sharpened", "A speed clinic with your team, so the pipeline runs without us", "The stage three judge attached before anything publishes"], "get": ["The pipeline, running, with your team operating it", "The prompt formula in your own library", "The post-processing pass as a repeatable step", "Per-asset cost and turnaround measured before and after"], "money": "Cost per finished asset, and assets per month. Both are numbers you already have for the current process."}, "voice-presenter": {"s": "production", "name": "Video and Voice System", "time": "2 weeks", "who": "Head of content", "promise": "Three delivery voices per presenter and a video edited by editing its transcript.", "problem": "One person is the face of the company and their calendar is the constraint on how much video exists. Recording sessions get scheduled, moved, and eventually cancelled.", "cost": "The channel goes quiet when that person is busy, which is exactly when the business is busy, which is exactly when the channel matters. Output tracks one individual's availability rather than the plan.", "hard": "The obvious answer is an avatar and the obvious answer is usually wrong. The material we work from teaches avatars at length and its own author now tells people the human video beats the clone and files avatars under advanced. We will give you the tooling and the formula and a written recommendation, and the recommendation is often not to.", "work": ["Three voices per presenter, because a whisper for a hook and an authoritative read for a call to action are different jobs", "Transcript-based editing installed, so a cut is a text edit", "The de-waxing pass for any generated footage of a person", "A written decision on avatars, with our recommendation and the reasoning"], "get": ["Three cloned delivery voices per presenter", "Transcript-based editing running in your stack", "The prompt formula in your library", "A written avatar decision you can point at later"], "money": "Measure it as assets shipped per month against the presenter's recording hours. If that ratio does not move, this did not work."}, "authority-aeo": {"s": "production", "name": "Authority and Answer Engines", "time": "2 weeks, then monthly", "who": "CMO, head of content", "promise": "A publishing programme with a monthly audit that scores whether answer engines actually cite you.", "problem": "People ask an assistant instead of a search engine, and you do not know whether you are ever named in the answer. Your SEO reporting does not cover it and nobody internally can say what your citation rate is.", "cost": "Invisibility here is invisible. Nothing in your dashboard gets worse. Demand that would have reached you simply arrives somewhere else, and the first measurable signal is a slow decline in a channel nobody attributed correctly.", "hard": "Most authority programmes never build the measurement, which means they run for a year on faith and get cut in the first budget review. The audit is the part that renews the engagement, and it needs a fixed query set scored the same way every month, which almost nobody sets up.", "work": ["A fixed query set of brand and category questions, agreed with you", "Baseline citation scoring across the set before anything changes", "Long-form publishing on a cadence, fed from your own story material", "The audit agent built and scheduled, scoring the same queries monthly", "Before-and-after reported every month with the trend"], "get": ["Your query set and your baseline citation rate", "Long-form pieces published on cadence", "The audit running monthly without us", "A trend line you can take into a budget conversation"], "money": "The baseline is usually the sale. Most companies have never seen the number and it is lower than they expect."}, "skill-authoring": {"s": "governance", "name": "Skill File Authoring", "time": "2 weeks", "who": "Head of engineering, head of operations", "promise": "A packaging standard for the instructions your AI systems run on, so they can be versioned, reviewed and handed over.", "problem": "Your prompts and instructions live in chat histories, personal notes and three people's heads. Nobody can review them, nothing is versioned, and when the person who wrote one leaves, what it was for leaves with them.", "cost": "An unversioned instruction is an undocumented system. You cannot audit what you cannot read, you cannot improve what you cannot diff, and you cannot hand over what was never written down.", "hard": "Packaging discipline is where good work fails. We have read four shipped skill packages from a competitor whose craft inside was high and which failed every mark of a basic standard, because nothing was checking for a version, a date or an author. The craft was never the problem.", "work": ["A house standard: what every package carries, without exception", "The siloed test installed, which is the most transferable thing we have found anywhere. Copy only that folder to a clean path with everything else switched off, act like a user with nothing, and anything it reaches for outside the folder is a gap to close", "Your existing instructions packaged against the standard", "The check that runs at delivery time, not at review time"], "get": ["The packaging standard, written", "Your existing instructions packaged and versioned", "The siloed test as a repeatable gate", "A delivery-time check, installed"], "money": "Judge it on handover. Pick a package, give it to somebody who did not write it, and see how far they get."}, "skill-server": {"s": "governance", "name": "Skill Server Deploy", "time": "3 weeks", "who": "Head of engineering", "promise": "One place where your AI instructions live, run and get updated, rather than seven laptops.", "problem": "Every operator has their own copy of every prompt, diverging quietly. When something improves, the improvement reaches whoever was in that conversation.", "cost": "Divergence is the same problem as no standard, arriving more slowly. Six months in, you have seven versions of an instruction, no way to tell which is current, and no way to push a fix to all of them.", "hard": "The technical part is small. The part that fails is the operating model around it: who may publish a change, what gets reviewed, and how an operator knows their copy is stale. A server with no governance is a shared folder with extra steps.", "work": ["The server stood up in your environment", "Your packaged instructions deployed to it", "Publishing rights defined, with a named approver", "A staleness signal so an operator running an old copy knows", "Your team trained to deploy without us"], "get": ["The server running in your environment", "Every instruction deployed and versioned", "A written publishing model with a named approver", "Your team operating it"], "money": "It pays when the first fix reaches everybody the same day instead of over a quarter."}, "agentic-email": {"s": "governance", "name": "Agentic Email Install", "time": "3 weeks", "who": "Head of marketing, head of revenue operations", "promise": "An agent that drafts and sends email, with a human gate in front of anything customer-facing.", "problem": "Email is the highest-return channel you have and it goes out when somebody remembers. The sequences that exist were written once and have not been touched since.", "cost": "An underused list is a paid asset producing nothing. The cost is not what the emails would have earned, it is that the whole channel drops out of the plan because it is unreliable, and the budget moves to paid acquisition at several times the price.", "hard": "Anything that sends on your behalf is the highest-risk thing in this catalogue, which is why it sits in this stage rather than in production. The install is half building and half deciding what it may never do without a person.", "work": ["The agent built against your own voice standard and rules file", "The send boundary drawn explicitly: what goes automatically, what waits for a person, and who that person is", "The judge in front of the send, not behind it", "Failure behaviour defined, because the question is what happens when it is unsure"], "get": ["The agent, running, with its boundary written down", "A named human owner and an approval step", "Grades on every draft before a person reads it", "A written list of what it may never do unattended"], "money": "Send volume and revenue per send, against what the channel produced when it depended on somebody remembering."}, "production-workflow": {"s": "governance", "name": "Production Workflow Install", "time": "4 weeks", "who": "Head of operations", "promise": "The end-to-end workflow your team actually runs, installed and documented, rather than assembled from whatever each person prefers.", "problem": "Everyone has a way of doing it. The ways differ, the quality differs with them, and onboarding a new person means an apprenticeship with whoever is least busy.", "cost": "Output quality tracks who did the work rather than what the standard is. That is invisible while the good people are there and expensive the moment one leaves.", "hard": "Workflow documents get written and not followed, because the written version is aspirational and the real one is faster. The fix is to capture what the good operator actually does, including the shortcuts, rather than to write down what ought to happen.", "work": ["We record the work as your best operator does it, rather than interviewing them about it", "The workflow generated from the recording, so the source of truth is the doing", "Turned into a checklist, because a checklist gets followed and a document gets filed", "Run by somebody who did not write it, and fixed where they got stuck"], "get": ["The workflow, end to end, as a checklist", "The recordings behind it", "A capture method your team runs for the next process", "One new person onboarded against it while we watch"], "money": "Time to competence for a new operator. Measure it once now and once after."}, "assistant-build": {"s": "governance", "name": "Assistant Build Program", "time": "2 weeks", "who": "Head of operations, plus a cohort", "promise": "A build standard and your own people trained to produce assistants against it, so you stop buying them one at a time.", "problem": "People are pasting the same context into a chat window forty times a week. The ones who have built an assistant built it their own way, and nobody can tell whether a new one is any good until it has been wrong a few times.", "cost": "Buying assistants one at a time means paying for the same thinking repeatedly and holding a set nobody can maintain. The capability never becomes yours.", "hard": "Training a cohort is harder than building the assistants yourself and it is the only version that lasts. The thing that makes it teachable is a diagnostic that tells a non-technical person which part to fix: if it gives the wrong kind of answer, fix the output section. If it gives a generic answer, fix the audience section. That one sentence saves a team weeks of unfocused tinkering.", "work": ["The build standard, with a source template your people fill in", "An archetype picker, so the shape gets chosen before anything is written", "Three to five live assistants built by your own people while we watch", "The diagnostic taught, so they can fix rather than restart", "Your foundation documents loaded into every one"], "get": ["The build standard and the template", "Three to five working assistants built by your team", "A trained cohort who can build the next one", "The diagnostic, as a one-page reference"], "money": "Count assistants built in the six months after we leave. If the answer is none, the training did not take and we would rather know."}, "ai-team-design": {"s": "governance", "name": "AI Team Design", "time": "4 weeks", "who": "COO, CTO", "promise": "An org chart for your automated work, with a named human owner on every agent and a review gate in front of everything that ships.", "problem": "You have twelve automations and no accountability model. Each was built by somebody for a reason, several run on schedules nobody set deliberately, and at least one does something nobody currently understands.", "cost": "Twelve disconnected automations are not an AI capability. They are twelve things that will each break once, and the one that breaks loudly will be the one publishing something customer-facing.", "hard": "This is governance, and governance does not survive as a policy document. It survives as a roster with names in it. The design decisions that make it work are unglamorous and specific, and they are the reason this is the engagement almost nobody offers.", "work": ["Every agent inventoried, including the ones nobody nominated", "One named human owner per agent. Not a team, a person", "A review gate installed in front of every output. No agent publishes", "Schedules offset deliberately, which buys rate limiting and readable logs for free", "Risk marked in the roster rather than remembered, with the risky ones labelled as such"], "get": ["The agent roster with a named owner on every row", "A scheduled-task calendar", "A review gate in front of every output", "A risk register inside the roster, not beside it", "The role shapes, so the next agent has a defined place"], "money": "This is the engagement that stops an incident. It is priced against what one wrong customer-facing output would cost you, and that is a number your risk function can produce."}, "claims-check": {"s": "governance", "name": "The Claims Check", "time": "2 weeks", "who": "CMO, general counsel, founder", "promise": "Decide what your business will and will not claim, then install it as a gate that runs before anything ships.", "problem": "Your claims are decided by whoever is writing. Marketing reaches further than legal would like, legal cuts things marketing needed, and the boundary gets renegotiated every time rather than decided once.", "cost": "A wrong claim in public copy is an incident, not a typo. The slower cost is that without a settled position every piece of copy carries an argument inside it, and the argument is had by the two most expensive people in the room.", "hard": "Two things make this hard and neither is legal. The first is that the decision has to be made explicitly rather than discovered, and companies avoid it because it involves giving something up. The second is that a decision nobody enforces is a preference, so the ruling has to become a rule inside a system.", "work": ["The distinctions supplied, the answers left to you. We facilitate the ledger, we do not write it", "Our own position disclosed up front, because we are not neutral and you should know that in the first meeting", "The ruling turned into rules inside the judge, where there is a pipeline", "A named human gate where there is not", "The four enforcement questions answered: who owns the check, what happens on a breach, how often it is reviewed, and whether you take work that crosses it"], "get": ["The ledger: what you will claim, what you will not, and why", "Rules in the judge, or a named gate, or both", "A breach procedure with an owner", "A review cadence with a date"], "money": "Sold standing, never bundled into something larger, because bundled it is the phase that gets cut. It is also the only engagement here that can lose you a client on purpose."}};

function foot(){
  return `<section class="dark tight"><div class="shell narrow stack">

      ${STAGES.map((s,i)=>`<div class="chainrow" style="--sc:${s.c}">
        <div class="sn2">Stage ${i+1}</div>

    <h1 class="h-hero">${esc(s.name)}</h1>
    <p class="lede">${esc(s.promise)}</p>

function stagePage(id){
  const s=byId(id); if(!s) return home();
  if(id==='ceiling') return ceilingPage();
  const i=STAGES.indexOf(s), prev=STAGES[i-1];

  <section class="hero" style="padding-bottom:30px"><div class="shell stack">
    ${srail(id)}
    <div class="rule" style="background:${s.c}"></div>
    <p class="eyebrow" style="color:${s.c}">${esc(s.n)} of 5 &middot; ${s.units.length} engagement${s.units.length>1?'s':''}</p>
    <h1 class="h-hero">${esc(s.name)}</h1>
    <p class="lede narrow">${esc(s.promise)}</p>
    <p class="narrow">${esc(s.lede)}</p>
    ${prev?`<div class="gate"><b>The gate.</b> This stage assumes ${esc(prev.name.toLowerCase())} is done. Where it is not, we say so before we quote rather than discovering it in week two. <a href="#/${prev.id==='ceiling'?'ceiling':'stage/'+prev.id}">${esc(prev.name)}</a></div>`:''}
  </div></section>
  <section class="band"><div class="shell stack">
    <h2 class="h-sec">Why this matters</h2>
    <div class="deck" style="margin-top:10px">${s.why.map(w=>`<div class="pt" style="border-color:${s.c}"><h4>${esc(w.h)}</h4><p>${esc(w.p)}</p></div>`).join('')}</div>
    <p class="band-line" style="margin-top:30px"><b>How we work.</b> ${esc(s.how)}</p>
  </div></section>
  <section><div class="shell stack">
    <h2 class="h-sec">${s.units.length} way${s.units.length>1?'s':''} to work with us in ${esc(s.name.toLowerCase())}</h2>
    <div class="solgrid" style="margin-top:10px">${s.units.map(u=>card(u)).join('')}</div>
  </div></section>` + foot();
}

function card(u){

  return `<a class="scard" href="#/unit/${u}" style="--accent:${s.c}">

    <div class="meta"><span>${esc(d.time)}</span><span>&middot;</span><span>${esc(d.who)}</span></div></a>`;
}

  const d=U[u]; if(!d) return home();

  </div></section>

  </div></section>
  <section class="band"><div class="shell narrow stack">
    <h2 class="h-sec">What you hold at the end</h2>

function limits(){

    <div class="rule"></div><p class="eyebrow">The boundary</p>
    <h1 class="h-hero">What this does not do.</h1>

  <section class="band"><div class="shell stack">
    <div class="deck">
      <div class="nope"><h4>Nothing about winning clients</h4><p>No outreach, no discovery process, no proposal design, no contracts, no referral system, no pricing method. There is a full body of work on all of it and none of it is an AI system, so none of it is here.</p></div>
      <div class="nope"><h4>Nothing about positioning</h4><p>No brand voice foundation, no differentiator work, no offer ladder, no belief architecture. These matter and they are not what this site sells.</p></div>
      <div class="nope"><h4>Most creative production</h4><p>Hooks, static ads, narrative formats, landing pages and funnel work are a person doing skilled work with a faster draft. Real, and not an AI system.</p></div>

  </div></section>
  <section><div class="shell narrow stack">
    <h2 class="h-sec">Three things we will refuse.</h2>
    <ul class="ticks" style="margin-top:8px">
      <li><b>We will not remediate a ceiling that is not binding.</b> The Ceiling Read names one of three and declines the other two in writing, even where you would pay for all three.</li>

function render(){
  const h=location.hash.replace(/^#/,'')||'/';
  let out;
  if(h==='/'||h==='') out=home();
  else if(h==='/ceiling') out=ceilingPage();
  else if(h.startsWith('/stage/')) out=stagePage(h.slice(7));
  else if(h.startsWith('/unit/')) out=unitPage(h.slice(6));
  else if(h==='/limits') out=limits();
  else if(h==='/start') out=start();
  else out=home();
  document.getElementById('app').innerHTML=out;
  document.title = titleFor(h);
  window.scrollTo(0,0);
  const t=document.getElementById('tgl');
  if(t) t.onclick=()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const next = cur==='dark' ? 'light' : (cur==='light' ? 'dark' : 'dark');
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem('hfm-theme',next)}catch(e){}
  };
}
function titleFor(h){
  if(h.startsWith('/unit/')&&U[h.slice(6)]) return U[h.slice(6)].name+' | Human First Media';
  if(h.startsWith('/stage/')&&byId(h.slice(7))) return byId(h.slice(7)).name+' | Human First Media';
  if(h==='/ceiling') return 'The Ceiling Read | Human First Media';
  if(h==='/limits') return 'What we do not do | Human First Media';
  return 'Human First Media | AI systems your company still runs a year from now';
}
try{const s=localStorage.getItem('hfm-theme'); if(s) document.documentElement.setAttribute('data-theme',s);}catch(e){}
addEventListener('hashchange',render);
render();

</script>
