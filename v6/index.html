<script>
const D={"TIERS": [{"id": "t0", "short": "Diagnostics", "n": "Tier 0", "name": "Diagnostics", "c": "var(--amber)", "hex": "#E08E1B", "tag": "One week or less. One finding you did not have. Then decide.", "promise": "Before you spend on AI, find out what is broken, what it costs you, and what the machines already say about you. Ranked, with the evidence attached.", "lede": "Four short engagements. Three hand you a finding about your own operation with the proof behind it; the fourth takes an hour and asks the answer engines who you are. Each is small enough to say yes to and honest enough to tell you something you did not want to hear. After that, the next decision is obvious.", "why": [{"h": "Improvement money goes to the loudest advocate", "p": "Without a shared diagnosis, budget follows whoever argued best in the last meeting. That is how a redesigned landing page ends up in front of a broken handover."}, {"h": "A finding travels further than an opinion", "p": "A ranked register with evidence behind each row can be taken into a board meeting. A point of view cannot. And the model's answer to who you are beats your opinion of your positioning."}, {"h": "You find out what a week with us is like", "p": "Each of these is a low-risk first engagement. Two of the four end with something fixed or switched off before we leave."}], "how": "We measure rather than interview. We walk your journey as a customer would, score your published work against a fixed rubric, ask your individual contributors what they did last week rather than asking their managers what the process is, and run the visibility check logged out, because a signed-in account personalises its own answers. Then we rank what we found with you in the room.", "units": ["client-journey-audit", "content-scorecard", "ai-task-triage", "ai-visibility-check"], "gate": null}, {"id": "t1", "short": "Foundation", "n": "Tier 1", "name": "Foundation and ground truth", "c": "var(--charcoal)", "hex": "#3A3631", "tag": "What every tool needs to know about you, and what your numbers actually capture", "promise": "Four documents about your company that every tool, assistant and writer reads first, plus the tracking and the model benchmark that everything above is measured against. Skip this and everything after it comes out generic, or unmeasured.", "lede": "Six engagements, and two kinds of ground. Four are about the company: voice, customer, differentiator, positioning, method. Two are about measurement: whether your conversion tracking captures anything a bot cannot fake, and what each model actually costs you for the quality you get. This is the tier clients want to skip. It decides whether the rest works.", "why": [{"h": "Your tools are not the problem", "p": "When everything the machine writes sounds like everything else the machine writes, the cause is almost always that nobody gave it anything category-specific to work from."}, {"h": "Bad signal trains the platform against you", "p": "Bot traffic generating fake conversions is not a reporting problem. The algorithm learns from it and starts finding more bots. Conversion tracking stopped being measurement and became defence."}, {"h": "Cost is a routing input, not an afterthought", "p": "The rule is quality over price, but measurable quality over price. The second clause is what makes it a rule rather than a slogan, and it requires a benchmark."}], "how": "We build from evidence, not from a workshop. Your voice is extracted from your own best writing, your customer's language from recorded calls and reviews, your differentiator tested against what competitors publicly claim. On measurement, events close to the money first, because actions harder for a bot to fake carry more signal. Then a check that runs at delivery time, because a standard nobody enforces is a preference.", "units": ["foundation-sprint", "positioning-antagonist", "name-your-method", "differentiator-day", "conversion-tracking-install", "model-routing-cost-read"], "gate": null}, {"id": "t2", "short": "Revenue", "n": "Tier 2", "name": "Revenue and offers", "c": "var(--gold)", "hex": "#F9B93E", "tag": "What you sell, how you price it, how you say it, how it moves", "promise": "Line up your offers so each one leads to the next. Price the work to what it recovers. Build pages that make the case. Plan the launch. And decide, on evidence, whether you are selling a project, a system or a relationship.", "lede": "Nine engagements, and two buyers. Four are about a company's offers: the ladder, the page, the launch, the pre-sell. Five come out of a practice that installs AI systems for a living and are about how a services business gets clients, prices, and structures what it sells. Read the second group only if you run a practice. None of the nine has a model in it that matters, and none carries a version number.", "why": [{"h": "Offers that share a rung eat each other", "p": "When two products solve a version of the same problem for a version of the same buyer, one absorbs the other's demand. It does not show up as a loss. It shows up as one product doing well."}, {"h": "The retainer argument has two sides and we hold both", "p": "One engagement here sells a maintenance retainer, derived from the fact that installed systems decay. Another argues directly against monthly billing and says to let the client ask. Which fits depends on whether your buyer experiences your work as a system that decays, a project that completes, or a relationship that renews. Averaging them would describe none of the three."}, {"h": "Price to what the client recovers, never to what a naive buyer would pay", "p": "The stated reason is retention. A client who finds out later what the market rate was does not stay, and it is far cheaper to keep a customer than to find one."}], "how": "Every offer we specify has to answer what this buyer will still need afterwards, and which of your products solves that. On pages, we front-load the argument into a structured preparation before a sentence is drafted. On pricing, three methods and one rule: charge what nobody can undercut, because a client who feels extracted from is a client you lose.", "units": ["offer-ladder-design", "sales-page-pipeline", "launch-design", "pre-sell-sprint", "pricing-architecture", "one-off-first", "ownership-offer", "results-in-advance", "maintenance-retainer"], "gate": "Tier 1's four company documents. An offer written from thin ground reads like every other offer in the category."}, {"id": "t3", "short": "Content", "n": "Tier 3", "name": "Content and production", "c": "var(--bronze)", "hex": "#B36F16", "tag": "Every piece moves a buyer one belief closer, and reaches them", "promise": "Content built around what a buyer has to believe before they purchase. Creative the platforms read as genuinely different. Images and video at a measured cost. Email that arrives. And a program for being named when a buyer asks a machine.", "lede": "Eight engagements, from the beliefs underneath through weekly production, depth, generated images and video, ad creative, email, and whether answer engines name you. Two rules run through all of it: every piece exists to install a specific belief about a named offer, and every generated asset has a model routed to it on quality and cost together, with a date on which that routing gets reviewed.", "why": [{"h": "A topic calendar is a publishing schedule in a strategy costume", "p": "It answers what shall we post about. It never answers what does this reader have to believe before they can buy, which is the question that connects content to revenue."}, {"h": "The platform decides what counts as different", "p": "Changing a headline or a background colour is read as the same creative. Six genuinely distinct concepts is not a style preference, it is the minimum the ranking system will recognise."}, {"h": "Citation is the new ranking", "p": "Falling traffic is often low-intent traffic now answered in the overview, and it was never going to convert. Brand mentions across the web, rather than backlinks, are what gets a business named."}], "how": "We build the belief set in your customer's own first-person language and derive the calendar from it. Production gets a review gate nothing bypasses, and we are explicit that the engine produces the base layer of your content and not all of it. On generated assets, the routing table and the cost per finished asset are deliverables, because a pipeline that cannot show it is cheaper than what it replaced is a belief, not a pipeline.", "units": ["buying-beliefs-map", "weekly-content-system", "copy-depth-workshop", "ai-image-system", "ai-video-voice-system", "newsletter-system", "aeo-authority-program", "creative-concept-set"], "gate": "Tier 1. Content built without the voice, the customer language and the differentiator comes out generic, and no amount of production fixes that."}, {"id": "t4", "short": "Operations", "n": "Tier 4", "name": "Operations", "c": "var(--sand)", "hex": "#CDAE6A", "tag": "Out of your head and onto paper", "promise": "Get how the business runs out of your head and into documents your team can follow. Then give every number a compared to what.", "lede": "Four engagements on how the company runs: the leadership habits above the systems, the documentation underneath them, four numbers you can act on, and the revenue leaking out through failed payments. This is the tier no AI engagement can skip, because you cannot automate what nobody wrote down.", "why": [{"h": "Growth costs more than it should", "p": "When the operation lives in a small number of heads, every new client and every new hire adds load to the same people, and the business scales with the least available resource in it."}, {"h": "You cannot automate what nobody wrote down", "p": "An undocumented operation has a hard ceiling on how much of it can ever be systematised, whatever tooling gets bought. Tier 6 assumes this tier is done."}, {"h": "Counts without denominators settle nothing", "p": "Revenue up twenty per cent while client count is up thirty is a business getting worse and reporting a good quarter. Nobody is being dishonest. The number does not carry the information."}], "how": "We invert how documentation is normally attempted. Rather than asking somebody to write a process up, the person who already runs it records themselves doing it and the written process is generated from the recording. Capture once, reuse many times. On measurement, the hard part is definition rather than arithmetic, so we settle what counts as a client and a lead in writing before computing anything.", "units": ["operations-install", "process-capture", "four-real-numbers", "failed-payment-recovery"], "gate": null}, {"id": "t5", "short": "Working relationship", "n": "Tier 5", "name": "The working relationship", "c": "#855013", "hex": "#855013", "tag": "How one person sets up with one model, before any agent exists", "promise": "The setup that makes Tier 6 work: instructions the model actually has, memory that survives the session, and a protocol for the day the model changes underneath you.", "lede": "Six engagements, and this tier exists because one source shows the same failure over and over across eighteen months of live sessions. People fail at agent work for reasons that have nothing to do with agents. No memory file. No guardrails. No preparation. Nothing in the other library addresses this layer, and filing it under AI systems is how it gets skipped.", "why": [{"h": "Preparation, not prompts", "p": "The single most repeated line in eighteen months of sessions: successful AI automation does not begin with prompts, it begins with preparation. Skill, research, guardrails, context. Then prompt."}, {"h": "The model does not read its own changelog", "p": "A new release does not make your existing setup better. Somebody has to ask it to review what you built with the new capabilities in mind, and almost nobody does."}, {"h": "The ladder became a fork", "p": "Chat, then Cowork, then Code was taught as a progression in January. By July the middle step had become a destination for a whole class of user. Routing somebody up when they should go sideways wastes months."}], "how": "Interview rather than instruct. The strongest single technique in the source is handing the model a list of questions and having it ask them one at a time until it says it is clear. Every engagement here is short, and every one is a precondition for something in Tier 6 rather than a product in its own right.", "units": ["claude-ecosystem-fork", "new-model-protocol", "model-migration", "preparation-before-prompts", "instructions-interview", "memory-persistence"], "gate": "Tier 1's four documents, because they are what the model gets set up with. A working relationship built on no material is a chat window."}, {"id": "t6", "short": "AI systems", "n": "Tier 6", "name": "AI systems and agent build", "c": "var(--stone)", "hex": "#8A857B", "tag": "Your people build the brain. Then it remembers. Then it runs.", "promise": "Assistants your own people build. Agents with one named human owner each, one job each, and a scope fence. A company knowledge base fed from vetted sources that stays current. And the architecture for running all of it without the bill scaling with the work.", "lede": "Seven engagements that take a company from people pasting the same context into chat windows to automated work with an org chart, a memory and a maintenance schedule. Three come from a library about organisational design and four from a practitioner's own running stack, which is why this tier has both the governance and the plumbing.", "why": [{"h": "Everyone starts every session from nothing", "p": "The first three exchanges of every conversation are the same explanation of who the company is. It is a small tax paid continuously by everyone, which makes it invisible and large."}, {"h": "One responsibility each, and the fence is the point", "p": "The agent template ends with a clause people skip: you are not doing other work, this is the only thing you do. Without the fence the specialists drift back into being one generalist, and without a named human owner nothing improves."}, {"h": "Somebody will ask the governance question", "p": "A board member, a client or a regulator asks what is automated, who is accountable and what gets reviewed. A company that cannot answer has to stop and find out, usually at the worst moment."}], "how": "We train your people to build rather than building for you, because a built assistant is one assistant and a trained cohort is a capability. Every agent gets one named human owner, never a team, and no agent publishes without a person in the path. We vet the sources before we build the brain, build the review gate before we build the agent, model it where iteration is cheap before we port it, and schedule the maintenance rather than waiting for something to break.", "units": ["build-your-brain", "ai-agent-roster", "company-brain", "skill-authoring", "browser-automation", "port-architecture", "vibe-coded-build"], "gate": "Tier 4 and Tier 5 both. You cannot automate what nobody wrote down, and an agent built by somebody with no memory file, no guardrails and no preparation fails for reasons that have nothing to do with agents."}], "U": {"client-journey-audit": {"t": "t0", "type": "N", "name": "Client Journey Audit", "time": "1 week", "who": "COO, head of revenue", "promise": "Find where people stop moving through your business. Ranked. One drop-off fixed before we leave.", "problem": "You spend to bring people in and cannot say where they stop. The top numbers look fine. The bottom numbers look thin. Every department has its own theory about the middle. Marketing blames the handoff. Sales blames the leads. Nobody is lying and nobody can prove it.", "cost": "The leak itself is the smaller cost. Every improvement gets aimed at a guess, so budget goes to whichever stage has the loudest advocate. The stages nobody owns do not get worse loudly. They get worse slowly. The first signal is a renewal number twelve months later.", "hard": "Journey mapping usually produces a diagram of how the business is supposed to work. Getting the version that runs means walking it yourself, from every entry point, reading the sequences as a customer receives them. Then pulling the number at each stage with the denominator stated. The stages where no number exists are findings on their own. They are also the ones a workshop never surfaces.", "work": ["We map all four phases live, with everyone who touches the customer in the room. Including the people who answer the phone", "We walk the journey ourselves from every entry point and record what is stale, broken or contradictory", "We pull volume and conversion at each stage from your systems, and mark the stages nobody measures", "We rank the leaks with you on volume and effort. You pick one. We close it with your team watching", "Where paid media is an entry point, we rebuild the ad reporting as columns in the order the customer moves: reach, click, landing page view, content view, add to cart, checkout, purchase. Then we read the drop-off between each pair of steps rather than the end number"], "get": ["A one-page journey map where every stage has a named owner", "A ranked leak register with the evidence behind each row", "Your instrumentation backlog: every stage you currently cannot measure", "One leak closed, live, before we leave", "A monthly re-audit your own team runs", "The funnel-shaped reporting preset, built in your ad account, with the two diagnostic rules written down"], "money": "Two ways. The leak we close is revenue recovered in the same week. The register stops the next four quarters of improvement budget landing on the wrong stage.", "gate": "**Two rules we apply to the ad account.** Upstream movement with no purchases means the ad is alive, not dead. Clicks that never reach the page mean speed or tracking, not creative. Below a few hundred conversions the pattern is noise, and we say so rather than reading tea leaves.", "idx": 1}, "content-scorecard": {"t": "t0", "type": "A", "name": "Content Scorecard", "time": "3 days", "who": "CMO, head of content", "promise": "Two charts that show why good content produces impressions and nothing else.", "problem": "The content is on brand, accurate, and out on schedule. What comes back is impressions and a few comments from people who already buy from you. The internal conversation has circled for months: more volume, better distribution, maybe video. Nobody can say what is wrong, because each piece read on its own looks fine.", "cost": "You keep paying for reach to fix a problem reach cannot fix. Meanwhile the content function loses its argument for budget. A team that cannot explain what is wrong cannot explain what would be better, so every request becomes a request for more of the same.", "hard": "Nobody can diagnose content by reading it. Each piece looks fine on its own. The problem shows up only as a distribution across the whole set, and that needs a fixed rubric two people can apply and agree on. Building a rubric that explains a company's own best work, rather than one that scores everything low, is the part that takes experience.", "work": ["We agree a sample of thirty to fifty pieces and calibrate the scoring with you live before running it", "Every piece scored on depth: how much of the persuasive structure it carries, out of seven elements", "Every piece assigned to the stage of buyer awareness it speaks to", "Two analysts score independently on an overlap sample, and we publish where they disagreed", "We rebuild five of your own pieces, so the difference shows on your material rather than somebody else's example"], "get": ["A depth distribution chart with the working floor marked", "An awareness coverage chart against where your revenue comes from", "The full scored dataset, so your team can extend it", "Five rewrites showing the original, the score and exactly what changed", "The scoring rubric, so new work gets graded before it publishes"], "money": "The coverage chart usually shows a whole stage of buyer awareness the company never speaks to. That stage is where new demand comes from. Everything else in the tier follows from knowing which of the two problems costs more.", "idx": 2}, "ai-task-triage": {"t": "t0", "type": "A", "name": "AI Task Triage", "time": "1 week", "who": "COO, CFO", "promise": "A ranked list of what to automate, a cancel list with a dollar figure on it, and one automation live before we leave.", "problem": "You have an AI budget and no ranked list of where to point it. Someone asked for a strategy and got a list of tools. Pilots nobody shut down. Licenses renewing on autopilot. One team built something good that no other team uses. Every proposal in your inbox looks plausible and none of them can be compared.", "cost": "Money first, and it is usually recoverable in the same week. Nearly every company we look at is paying for tools nobody has opened in ninety days. The larger cost is build order. Automate something that still needs a human and you get a system somebody supervises forever. Automate something nobody wrote down and you get a system that encodes one person's habits, then breaks when they leave.", "hard": "The census has to come from individual contributors rather than managers. Managers describe the process as designed. Contributors describe it as run. The triage also has to be willing to take things off the list. A review that recommends automating everything is not a triage, and holding that line in a room that has already bought a platform takes some spine.", "work": ["We open by replacing the question in the room. Not what does the tooling cost, but what does each seat produce, in the holder's own units: drafts, tickets, builds, reels. Cost per seat is uniform and output per seat is not", "We interview eight to fifteen individual contributors about what they repeated last week, not what they typically do", "Every task goes through three questions with your leadership group: does it need a human, can it be standardized, is it slowing operations down", "We compare your software spend against actual usage and against what the backlog needs", "We build the top item and leave it running, owned by one of your people"], "get": ["The task census, named by the people who do the work", "A ranked backlog with the reasoning behind each rank", "A leave-alone list, so nobody re-proposes automating judgment next quarter", "The cancellation list with its annual figure", "One live automation, and the one-page triage method your managers run next quarter", "A per-seat output table, with each before figure marked as measured or reconstructed"], "money": "The cancellation figure is real money off your invoices, and it frequently exceeds the cost of the engagement. We hold ourselves to that. If it does not, we say so at the readout.", "gate": "**We will not use somebody else's benchmark as your before figure.** Where none exists we reconstruct one and mark it reconstructed. Trimming an AI budget on cost alone removes the seats producing the most and keeps the ones producing nothing.", "idx": 3}, "ai-visibility-check": {"t": "t0", "type": "A", "name": "The AI Visibility Check", "time": "1 hour", "who": "Founder, whoever owns the brand", "promise": "What the answer engines say when somebody asks who you are, taken live and logged out.", "problem": "You have a positioning statement. Nobody has checked whether the systems that now answer most questions about your category have ever heard it.", "cost": "A positioning nobody outside the building shares is not a positioning. Businesses spend years being known for something the market has never associated with them, and the first signal usually arrives as a lost deal nobody can explain.", "hard": "Almost nothing, technically, and that is the point. What people get wrong is running it signed in. A personalised account returns answers shaped by your own history, which is how an operator concludes his clients rank first everywhere when they do not.", "work": ["Two queries, run logged out and in a clean session: who is [your name] and what are they known for, and the same for the company.", "The same queries across more than one engine, because they disagree and the disagreement is informative.", "A competitive pass: the three queries a buyer in your category would actually type, and who gets named instead of you.", "Where the answers came from. The cited sources are the properties actually doing the work, and they are rarely the ones you have been maintaining."], "get": ["The verbatim answers, with their sources, across engines", "The gap between what you say you are known for and what comes back", "The list of properties currently speaking for you", "Three queries you are absent from that you should not be"], "money": "An hour, and the cheapest thing on this site. It exists to make the next decision obvious rather than to become a project.", "gate": "**If the answer comes back empty, that is a finding and not a failure.** Some categories return no clear leader at all, which makes them cheap to win and changes what we would recommend next.", "idx": 4}, "foundation-sprint": {"t": "t1", "type": "N", "name": "Foundation Sprint", "time": "2 weeks", "who": "CMO, founder", "promise": "The four documents every AI tool in your company reads first, built from your own material, with a check that enforces them.", "problem": "Everything the machine writes sounds like what it writes for everyone else. You bought the tools. People use them. What comes out is competent and unmistakably not you. So it gets rewritten by hand, which means the tool saved nothing. Or it goes out as is, which is worse.", "cost": "Everything built after this inherits it. Belief-driven content, offer architecture, sales pages, assistants and agents all read these documents first. Thin input does not produce slightly worse output. It produces generic output at every stage. Then the tools get blamed. A company concludes AI does not work for their category, when nothing category-specific was ever supplied.", "hard": "Brand voice work is usually adjectives chosen in a workshop, which is why it changes no output. Doing it properly means pulling the voice out of a company's own best writing. It means taking customer language from recorded calls, support threads, intake forms, and reviews of the products they considered instead of yours. That last source is the one nobody tries. It is where objection language lives.", "work": ["We collect raw material rather than asking you to summarize it: recordings, support threads, intake forms, your own best writing", "We pull out the patterns: the words your customers use, their frustrations, and what they tried before you", "Voice gets described from your corpus, never chosen from a list of adjectives", "Your differentiator gets tested against your competitors' public claims. Anything on both lists is cut", "We build a check that reads every draft against your standard at delivery time, and fails the ones that do not comply"], "get": ["Brand voice, with every trait citing a real example from your own material", "Ideal client, including what they fear and the words they use for their own problem", "Differentiator, with what was cut and why", "Company details: the factual keystone every tool and assistant reads first", "A banned-word standard with a working enforcement check, and a named owner for keeping it current"], "money": "This one makes no money directly. It decides whether the nine engagements after it do. We will tell you when something you want cannot be delivered well without it, which happens more often than either of us would like.", "idx": 5}, "positioning-antagonist": {"t": "t1", "type": "N", "name": "Positioning and the Antagonist", "time": "1 week", "who": "CMO, founder", "promise": "Give your positioning something to argue against. Then write down the objection answers your best salesperson gives in the room.", "problem": "You can say what you do. You cannot say what you are against. Your messaging describes the product accurately and reads like everyone else in the category, because the category settled on the same vocabulary years ago. The clearest symptom shows up in objections. When a prospect raises the real one, your material answers defensively, and a defensive answer confirms the objection.", "cost": "Your best salesperson handles that objection well in person, with an argument that exists nowhere in writing. Everyone who does not get that conversation meets the defensive version instead. And content that argues for something without naming what it argues against has no reason to feel urgent.", "hard": "The instinct is to name a competitor. That is legally exposed and it ages badly. Worse, it makes your customer the audience for a fight they do not care about. The real antagonist is a belief, a habit, or an approach the category still teaches. Finding it means working from what your customers already tried and what let them down. It also has to be specific enough to draw, and honest enough to admit why people believed it.", "work": ["We build the positioning narrative in story order rather than as a claims list", "We hunt the antagonist in your customers' failed attempts, not in your competitor set", "We build one primary antagonist and two to four supporting ones. Each gets an honest account of why it persuades, not only why it fails", "We map each of your five hardest objections to the antagonist that defeats it, and write the defeat", "We load the finished document where your writers and assistants read from, so it gets used rather than filed", "We run the leader queries across your candidate positions and record which fields return no clear leader at all. Those are cheap to enter. The crowded ones behave like early search, where whoever is at the top tends to stay"], "get": ["A positioning narrative with the process story written out", "A named antagonist set, specific enough that a designer can draw it", "The objection map: objection, antagonist, defeat, and where each gets used", "A hook and slogan set drawn from the narrative", "A placement guide, including where the antagonist sits in a talk", "The uncontested fields, named, with what the chosen lane excludes written down"], "money": "The argument your best salesperson makes in the room becomes an asset anyone can use. That is the first time it has ever been available to the rest of your team.", "gate": "**One lane.** Being credible at several things reads as being the leading name in none of them, and the systems answering buyers' questions reflect that exactly. If every hat has to stay on, we would rather say so before starting.", "idx": 6}, "name-your-method": {"t": "t1", "type": "N", "name": "Name Your Method", "time": "1 week", "who": "Founder, product marketing", "promise": "Name the method you already run, so buyers stop comparing you on price.", "problem": "You do something specific and repeatable and it has no name. Your delivery team knows the sequence. When a prospect asks how you work, the answer gets assembled fresh by whoever is in the room. You have tried this before. Somebody proposed an acronym, it felt forced, and everyone stopped using it.", "cost": "You compete on rate. Buyers compare what they can compare, so two firms describing similar activities get compared on price and availability. Underneath that, an unnamed method has no reference version. Each senior person runs their own variant, and quality tracks who was assigned rather than what was promised.", "hard": "The failed attempt is almost always the same mistake: reaching for an acronym before choosing a shape. An acronym only fits a method whose stages happen to start with cooperative letters. A framework can take ten shapes. Running your method against several of them before you write anything is what stops the result feeling forced.", "work": ["We reconstruct the method from three completed engagements rather than from a whiteboard", "We keep only the stages that cause a specific, predictable failure when skipped", "We test your method against ten possible framework shapes and build rough versions of the best two", "We apply the differentiator test to the framework itself, marking which stages are yours and which are table stakes", "Two live tests. Somebody outside the room plans real work from it. A senior person explains it in ninety seconds without the diagram"], "get": ["A named framework with every stage specified: inputs, outputs, owner, failure mode, done condition", "A production diagram usable in front of a client", "The claim split: what is differentiating and what is table stakes", "The ninety-second explanation, written, so everyone tells the same story", "The authoring guide, so your team names the next method without us"], "money": "A method with a name is something you own and price. An unnamed process is a description of labor, and labor gets compared on rate. You can come out ahead in that comparison and still be having the wrong conversation.", "idx": 7}, "differentiator-day": {"t": "t1", "type": "N", "name": "Differentiator Day", "time": "1 day", "who": "Founder, exec team", "promise": "One day to surface the concrete reasons clients choose you, the ones your positioning filtered out for sounding unprofessional.", "problem": "Your positioning could have been written by any of your competitors. It is true of all of you. Experienced team. Tailored approach. Meanwhile the real reason clients pick you is something specific that appears nowhere in your material. Ask a client why they chose you and they say something concrete you have never written down.", "cost": "The interesting part never reaches the market. It gets filtered out at every draft for seeming unprofessional. Everything downstream goes generic too, because positioning, offers and content all read the differentiator as input.", "hard": "The professional register is what removes everything distinctive. A session that starts with values produces a list of corporate virtues. Getting past that filter takes prompts that lower the stakes on purpose. It looks absurd for the first half hour, and that is the reason it works. In a company the differentiator is rarely one person, so the real finding is what repeats independently across several of them.", "work": ["A facilitated day, four to eight people, business set aside entirely for the first hour", "Twenty specifics per person across five prompts, including one deliberately unserious one", "We mark what repeats independently across three or more people, and what makes the room lean in", "Everything that repeats gets tested three ways. Is it true of how you work. Would a competitor's list contain it. Does a client ever experience it", "Everything gets tagged and kept, because most of what this produces is story material rather than positioning material"], "get": ["The full captured list, tagged by where it is useful", "The repeats, which are firm characteristics rather than personal quirks", "Differentiator candidates with their test results shown", "Story seeds that feed content and recruiting for a year", "The session method, so you can run it with a new team"], "money": "It is the cheapest engagement on the suite and it improves the three around it. It is also the best qualifier we have. A leadership team that takes this seriously will do the harder foundation work.", "idx": 8}, "conversion-tracking-install": {"t": "t1", "type": "N", "name": "Conversion Tracking Install", "time": "1 week", "who": "Media buyer, developer, whoever owns the site", "promise": "Server-side conversion tracking with events chosen close to the money, and a bot filter that does not punish real buyers.", "problem": "Browser pixels observe what a browser does, and a bot can do most of it. Fake activity with realistic names and addresses is now common enough to move the algorithm.", "cost": "This is the failure that compounds against you. The platform learns from whatever you send it, so bot-generated conversions teach it to find more bots. You do not get a flat result, you get a worsening one, and the reporting looks fine throughout.", "hard": "Choosing the events. Everything downstream depends on picking actions that are hard to fake and close to a real transaction, and the temptation is always to instrument the easy ones.", "work": ["Audit what the current pixel is actually firing, and how much of it could be automated.", "Select events by proximity to money rather than by convenience, on the stated principle that the closer an event is to a financial transaction the more valuable its signal.", "Build the Conversions API integration server-side, with deduplication against the existing pixel.", "Install the honeypot: a hidden form field invisible to humans, with two automation paths depending on whether it was filled. This replaces CAPTCHA, which modern models answer easily and which costs you genuine prospects.", "Verify with live traffic and compare the two signal sources for a fortnight."], "get": ["Server-side tracking, live and deduplicated", "An event map ordered by proximity to revenue", "The honeypot field, installed, with both automation paths built", "A fortnight of side-by-side signal comparison"], "money": "One week. There is no AI in this engagement at any point, which is why it is the cheapest thing here to keep working.", "gate": "**If your site is on a platform that will not accept server-side events, we will say so before starting** rather than building half of it.", "idx": 9}, "model-routing-cost-read": {"t": "t1", "type": "C", "name": "Model Routing and Cost Read", "time": "1 week", "who": "Whoever holds the AI budget and the technical lead", "promise": "A routing rule for which model does which job, held against a live benchmark rather than against what was true when you set it up.", "problem": "Work gets sent to whichever model somebody trusts. Usually that is the most expensive one, for everything, including work that does not need it.", "cost": "Routing by habit is expensive in both directions. You overpay on the bulk of the work and underperform on the part that actually needed the stronger model, and because the bill is a single line nobody can see either half.", "hard": "The tiebreaker. The rule that makes this work is quality over price, but measurable quality over price, and the second clause requires you to have decided what measurement means for each job type before the routing exists.", "work": ["Classify your recurring AI work by job type: writing, documentation, code, orchestration, research, image, video.", "Set the subscription-first ordering, so the capacity you already pay for is used before anything is bought by the token.", "Build the routing agent, given a live benchmark and instructed to re-read it before each job class rather than holding a memorised list.", "Install the recurring check, because the model list changes weekly and a routing table written today is wrong within the quarter.", "Write the sensitivity rule: which categories of data never leave which vendor. In the source material this rule lives in the operator's head, and that is the part we fix."], "get": ["A routing table by job type, with the reasoning", "The routing agent, reading a live benchmark", "A scheduled re-check, with an owner", "A written data-sensitivity boundary, in the file rather than in somebody's head"], "money": "One week to build, and it is the engagement on this site most likely to pay for itself inside a quarter.", "gate": "**This ages faster than anything else we sell.** The scheduled re-check is not an upsell, it is the reason the engagement is worth buying, and we will not build it without one.", "idx": 10}, "offer-ladder-design": {"t": "t2", "type": "N", "name": "Offer Ladder Design", "time": "2 weeks", "who": "Revenue lead, founder", "promise": "A three-rung ladder where every offer names what the buyer needs next and which of your offers provides it.", "problem": "Your offers compete with each other and your best customers have nowhere to go next. The list grew by accident. Somebody built a thing for one client, it became a product, and it now sits beside two others solving a version of the same problem for a version of the same person. Sales cannot say which one a prospect should buy without a call.", "cost": "Cannibalization you cannot see in the numbers. When two offers occupy the same rung, one absorbs the other's demand and it reads as one product doing well. Then there is the expansion revenue you never earn, because a customer who finished and is happy has no designed next step. And every unnecessary choice you hand a buyer adds time and risk to the deal.", "hard": "The ladder only works if every offer answers two questions offer documents rarely ask. What will this buyer still need afterwards. Which of your products solves that new problem. Making those required fields rather than instinct is the whole mechanism. It also means somebody has to decide what happens to the offers that turn out to share a rung. That decision is political, and it is why this work stalls without help.", "work": ["Every current offer specified against fifteen fields, using what exists rather than what people say", "We plot your offers on problem size against price, and the overlaps become visible without anybody arguing for them", "Commercial, delivery and finance decide together for each cluster: consolidate, reposition or retire", "We check the distance between rungs. Too close and they cannibalize. Too far apart and buyers fall out in between", "We write the intention and the objective for every offer as separate sentences, which is what keeps the copy from sounding manipulative"], "get": ["The three-tier ladder, each rung with its promise, price and buyer", "Complete fifteen-field specifications including both exit fields", "The overlap finding, with a decision recorded against every clustered offer", "A transition map: how a buyer moves up, on what trigger, owned by whom", "The specification template, so the next offer gets built to the same standard"], "money": "This is the commercial work that moves the most money on the suite. Companies with five products and no ladder routinely find in one session that three of them share a rung. The expansion path they never designed turns out to be the cheapest revenue they have.", "idx": 11}, "sales-page-pipeline": {"t": "t2", "type": "A", "name": "Sales Page Pipeline", "time": "1 week per page", "who": "Demand generation", "promise": "One live sales page, and the process that makes the next one take two days instead of six weeks.", "problem": "A sales page takes six weeks and reads like a feature list. The brief is a product description. The first draft describes what the thing is. Every department adds the point it cares about in review. The page ends up complete, accurate, and confirming a decision the buyer already made somewhere else.", "cost": "When a page takes six weeks, the page becomes the critical path and campaigns get scheduled around a copy deadline. Without a sequence, quality tracks whoever wrote it and how much time they had. Your best page and your worst page each represent you to whoever lands on them.", "hard": "Most of the six weeks goes on arguing about what the page should say, and no amount of writing skill removes that. The fix is a structured preparation finished before a single sentence gets drafted. Teams find it uncomfortable for about an hour. Holding that line is the difference between a page and a process.", "work": ["Eleven-step preparation worked through with your team before any copy is written", "We structure the same offer five different ways and choose deliberately rather than by habit", "Every feature is pushed through to a real benefit, using a mechanic your team can apply in ninety seconds", "Headlines are selected from a generated set rather than written once and defended", "Every claim gets traced to evidence or removed. Never softened into a vaguer version of the same unsupported claim"], "get": ["One live page for a real offer, in your CMS, measured", "The completed preparation, plus the blank instrument for every future page", "Five structural versions of the same offer as a teaching reference", "A claim register showing what is evidenced and what still needs proof", "A written production sequence with roles, gates and expected durations"], "money": "Page two takes two days. Across a year of campaigns that is the difference between marketing setting the schedule and the copy deadline setting it.", "idx": 12}, "launch-design": {"t": "t2", "type": "N", "name": "Launch Design", "time": "2 weeks", "who": "Revenue lead", "promise": "An eleven-stage launch you can run again, with the dead middle planned and the people who did not buy sorted by why.", "problem": "Launches spike once and die. Sales come in on day one, then almost nothing, then a small bump at the deadline that everyone credits to urgency. The middle is dead because nobody planned the middle. Or there is no launch at all, and revenue arrives whenever sales makes it arrive.", "cost": "The dead middle is the largest single loss. In a launch of any length, the middle is where most of your audience is still deciding. Then everyone who did not buy gets treated as one group and receives the same follow-up, or none. They did not buy for opposite reasons.", "hard": "Launch sales follow a predictable double-peaked shape. Knowing the shape is not the same as using it. The second peak has to be built with something that did not exist at open, which means it goes into the calendar before the launch starts. A spike planned during the dip arrives after it.", "work": ["We map all eleven stages and fill your version of each, with an owner and a date", "The trigger event gets chosen on evidence rather than defaulting to a webinar", "Three sequences specified message by message, with the follow-up built at nine steps rather than three", "The mid-launch event is placed in the calendar with an owner before the launch opens", "We build reason capture and two opposite routes into your CRM, so non-buyers are split rather than blanketed"], "get": ["The eleven-stage launch map, owned and dated", "A trigger event decision with the reasoning recorded", "Show-up, cart-open and follow-up sequences, specified", "Live post-close segmentation in your CRM, tested both ways", "A belief-assigned run-up calendar and a run-book so the next launch is not built from scratch"], "money": "Post-close segmentation is where the recoverable revenue sits, and it is the part that rarely gets built. People who did not buy because of money need something smaller. People who did not buy because they wanted more support need more, since that is a buying signal rather than a request for a discount. Half your non-buyers have been getting the wrong message.", "idx": 13}, "pre-sell-sprint": {"t": "t2", "type": "N", "name": "Pre-Sell Sprint", "time": "5 days", "who": "Founder, product", "promise": "Find out whether anyone will pay for the thing before you build it. Five days. Payment is the only signal we count.", "problem": "You have a twelve-month roadmap and no way to know whether anyone wants what is on it. Every item is a bet and every bet resolves the same way: build it, ship it, find out. By then the budget is spent, and admitting it did not work costs more than calling it phase one.", "cost": "You learn what customers want at the most expensive possible moment. After the build, when sunk cost makes the answer hard to hear. And speed becomes a capability you do not have, so opportunities in a moving category go to somebody else as a matter of structure rather than luck.", "hard": "Pre-selling works, and it assumes nobody else's job breaks when you do it. In a company that is untrue. The adaptation is one meeting: finance, legal and support agree the price, the delivery date and the refund position before anything is published. The other hard part is setting the go or no-go threshold before you see the data. Renegotiating it afterwards is the most likely failure and the most damaging.", "work": ["Three independent research passes on the subject, merged, treating what all three surface as the finding", "Offer candidates generated by asking what your customers could be helped to do rather than what you could do", "A pre-commitment review with finance, legal and support before anything is published", "A validation offer published, with every response worked by hand and recorded", "Build in two days if the threshold is met. Stop and write the finding if it is not"], "get": ["The merged research, showing where the three passes disagreed", "Offer candidates with the selection reasoning recorded", "The pre-commitment record and the refund position", "A named lead list, with what each person said they wanted", "A live offer, or an evidenced decision not to build one, plus the method so your team runs the next sprint"], "money": "Interest expressed in a research call and interest expressed with a payment are different signals, and only one predicts revenue. A sprint that ends in a decision not to build is a successful sprint. It costs five days instead of two quarters.", "idx": 14}, "pricing-architecture": {"t": "t2", "type": "N", "name": "Pricing Architecture", "time": "1 week", "who": "Founder, whoever writes the proposals", "promise": "Three pricing methods, matched to the three situations they each work in, with an explicit rule against extraction.", "problem": "Pricing is set by instinct and defended by anecdote. The same service goes out at wildly different numbers depending on how the conversation went.", "cost": "Underpricing is the obvious loss. Overpricing a buyer who does not know the market is the expensive one: they find out, they leave, and they tell people. The source is blunt that a client who discovers they were taken will resent it permanently.", "hard": "Knowing which method applies. Markup works for tooling-based services, value-based works where the client's recovery is measurable, time-based is the fallback for low volume. Applying the wrong one produces a number you cannot defend in the room.", "work": ["Establish hard cost per service, including tooling and delivery time.", "Apply the markup method where the service is tooling-based: ten to twenty times hard cost plus implementation.", "Apply value-based pricing where recovery is measurable: count the missed calls, the lost leads, the unbilled hours, and price against the recovered amount.", "Use time-based as the fallback for clients with too little volume for either.", "Install the anti-extraction rule: price where nobody can undercut you, because retaining a client costs less than acquiring one."], "get": ["A rate structure with three methods and the trigger for each", "Hard cost per service, calculated", "A value-based worksheet for the measurable cases", "The anti-extraction rule, written into the process"], "money": "One week. No AI in it anywhere, and it will not need revisiting when the models change.", "gate": "**We will argue against your highest defensible price.** The rule here is deliberately not revenue-maximising in the short term, and if that is not what you want, this is the wrong engagement.", "idx": 15}, "one-off-first": {"t": "t2", "type": "N", "name": "The One-Off-First Sequence", "time": "1 week", "who": "Founder, sales lead", "promise": "A sales sequence that opens with a single transaction and lets the recurring relationship be asked for rather than proposed.", "problem": "Every piece of advice in the market says to sell recurring revenue first. Buyers are increasingly tired of being billed monthly, and the ask is large at the exact moment trust is smallest.", "cost": "Leading with a retainer maximises the size of the first decision. Most prospects decline it and would have said yes to something smaller, so the pipeline reads as poor fit when it is actually poor sequencing.", "hard": "Holding the line when the one-off closes well. The instinct is to convert immediately. The sequence works because the client asks, and asking too early resets it.", "work": ["Design the one-off: small, complete, genuinely useful on its own, and not a trojan horse.", "Price it to be an easy yes and deliver it visibly better than expected.", "Do not propose the ongoing. Let the second conversation start from the client's side.", "Build the ownership variant for buyers who want to own an agent for a flat fee rather than subscribe to one.", "Track which clients ask, and how long it takes, so the sequence is measured rather than believed."], "get": ["A one-off offer, specified and priced", "A delivery standard for it", "The ownership-model variant", "A tracking measure on ask rate and time to ask"], "money": "One week to design. It changes the shape of the pipeline rather than the volume.", "gate": "**This contradicts the maintenance retainer above and we are not going to hide that.** Both come from the same practice, four days apart. Which one fits depends on whether your buyer experiences your work as a system that decays or as a project that completes.", "idx": 16}, "ownership-offer": {"t": "t2", "type": "N", "name": "The Ownership Offer", "time": "2 weeks", "who": "Founder designing what to sell next", "promise": "An offer built around the client owning the system rather than renting it, and the service business that sits on top.", "problem": "Everything is sold as a subscription because the industry decided that was the model. Buyer preference has moved and most offers have not.", "cost": "Selling only a subscription loses every buyer who wants to own the thing, and that is now a significant share. It also caps you at the software margin when the durable revenue is in being the person who runs it.", "hard": "Separating what should be owned from what should be ongoing. The system can be owned; the maintenance cannot be, because the decay is continuous. Getting that line wrong produces either an unsustainable promise or an offer nobody wants.", "work": ["Define the ownable unit: what the client buys once and holds.", "Price it against the flat-fee alternative rather than against a subscription's lifetime value.", "Define the service layer that sits on top, which is where the durable revenue is.", "Build the hundred-small-clients version of the model as the alternative to a few large ones.", "Write the handover so ownership means something rather than being a licence in different words."], "get": ["An ownable unit, defined and priced", "A service layer on top of it", "A handover standard that makes ownership real", "A model comparison against your current structure"], "money": "Two weeks. It is an offer design engagement, not an implementation.", "gate": "**This rests on a prediction rather than a measurement.** The claim that buyers are moving back to ownership is one practitioner's reading of his own market, and we will present it as that rather than as a trend.", "idx": 17}, "results-in-advance": {"t": "t2", "type": "N", "name": "Results-in-Advance Outreach", "time": "2 weeks", "who": "Founder, whoever does business development", "promise": "An outreach sequence that leads with work already done rather than with a request for a meeting.", "problem": "Cold outreach asks for time before it has given anything. Response rates reflect that, and the response is usually to send more of it.", "cost": "Volume outreach with nothing in advance burns the list and the sender's name at once. You get a low response rate and a reputation, and both are hard to reverse.", "hard": "Doing the work before the yes. Every part of this is easy except the part where you produce something real for somebody who has not agreed to anything, which is precisely why so few do it.", "work": ["Identify a narrow target set where the same improvement is visible from outside.", "Do the work first: the rebuild, the audit, the fix, actually produced.", "Send something physical that gets opened, with the work attached.", "Let them name the price on the first transaction, so the first exchange is not a negotiation.", "Offer the obvious adjacent service at the point of delivery, since the relationship is now established."], "get": ["A target set and the repeatable improvement for it", "A physical send that gets opened", "A first-transaction structure with the price left open", "A measured response rate on your own sends"], "money": "Two weeks to build the sequence. The per-send cost is real and is the reason the targeting has to be narrow.", "gate": "**The outcome numbers in the source are one practitioner's self-report on an unstated sample.** Seventy-five per cent response and a seven-hundred-and-fifty average are what he said, not what we measured, and we will not quote them to you as evidence.", "idx": 18}, "maintenance-retainer": {"t": "t2", "type": "A", "name": "The Maintenance Retainer", "time": "Ongoing", "who": "You, if you sell AI systems. Your client, if you buy them", "promise": "A recurring service built on the fact that AI systems decay, priced against an observed property rather than a pricing tactic.", "problem": "AI systems are sold as builds. Models change, APIs change, vendor instructions change, skills go stale, and six months later the thing works worse than it did at handover.", "cost": "For the buyer, a system that quietly degrades is worse than one that fails, because nobody investigates. For the seller, a one-time build means the relationship ends exactly when the decay starts and the client's experience of your work is its worst version.", "hard": "Nothing to build. The difficulty is that this is usually invented as a pricing strategy and therefore sold unconvincingly. Derived from the decay instead, it is a genuine need and sounds like one.", "work": ["Monitor vendor documentation and change logs on a schedule.", "Update agents, skills and vendor files when the model underneath changes, in the correct order.", "Test performance against real tasks rather than self-reports.", "Resolve compatibility issues as vendors move.", "Report what changed and what it cost, so the retainer is auditable rather than assumed."], "get": ["Scheduled monitoring, with an owner", "Updates applied in the correct order", "Real-task performance testing", "A change report each period"], "money": "Ongoing. **The most directly transferable commercial idea in the source material**, and the only one derived from an observed property rather than asserted.", "gate": "**Read this against the engagement below it, which argues the opposite.** The same practice sells this retainer and argues against monthly billing four days apart. We hold both positions and will tell you which fits your buyer rather than pretending there is one answer.", "idx": 19}, "buying-beliefs-map": {"t": "t3", "type": "N", "name": "Buying Beliefs Map", "time": "1 week", "who": "CMO", "promise": "Replace the topic calendar with the beliefs a buyer has to hold before they purchase.", "problem": "Your content calendar is organized by topic. Somebody lists themes, somebody assigns them to weeks, and the output answers what should we post without ever answering what does this reader need to believe. The content is informative and inert. When a piece performs, nobody can say why, so it cannot be repeated.", "cost": "Content and revenue never connect, which is why the content team's contribution gets argued about every budget cycle and never settled. And nothing accumulates. Twelve months of publishing leaves you with an archive rather than a case.", "hard": "The seven belief categories look like a checklist. They are a sequence. Four of them form a ladder, running from readers who do not know they have a problem through to readers deciding between you and a competitor. Beliefs also have to be written in the customer's own first person. The category everyone gets wrong on the first pass is the one that must not mention your offer at all.", "work": ["We build the belief set for one named offer, in the customer's first-person language, using their recorded words", "Seven categories, three to five beliefs each, with the ladder structure mapped onto four stages of buyer awareness", "We plot your existing content against the same map, which usually reveals a stage you never speak to", "Objection beliefs written from what sales hears, and urgency written only where it is real", "One belief assigned to each week of the next quarter, sequenced by awareness stage"], "get": ["The belief table, first person, in your customer's language", "The awareness map, with the ladder shown", "A coverage finding naming the stage your content never addresses", "A derived quarterly calendar with a brief per week", "The method, so the next offer gets its own belief set without us"], "money": "This is the decision that turns a posting schedule into a sales system. Every piece afterwards exists to install a specific belief about a named offer, which is what connects content spend to revenue.", "idx": 20}, "weekly-content-system": {"t": "t3", "type": "A", "name": "Weekly Content System", "time": "3 weeks", "who": "Head of content", "promise": "A weekly production system your own team runs, fed by a bank of your real stories.", "problem": "Content production eats a team and produces a trickle. Three people are busy. Output is four or five pieces in a good week, and good weeks are the ones without a launch or a conference. You tried AI tools. They produced volume that needed so much editing the editing became the bottleneck.", "cost": "Consistency is the thing you never get, and consistency is what compounds. Sporadic publishing never builds an audience, so every piece starts cold. And your most expensive people spend their week deciding what to post rather than deciding what to argue.", "hard": "The honest constraint is that a content engine produces the base layer, not the whole function. It cannot write your human material and it cannot supply your opinion on this week's news. Companies sold an engine as the complete answer end up disappointed by a system working correctly, so we say this at kickoff and again at handover. The other hard part is the story bank. The material sits in people's heads and decays in about a month.", "work": ["We measure your current state rather than describing it: pieces, hours, elapsed time from brief to publish", "We design your week rather than importing a template, with each slot given a stated job and awareness stage", "We seed the story bank from your people's specific results, origins and failures, then install a capture routine inside a meeting that already exists", "We build the pipeline end to end with a review gate nothing bypasses", "In week three your team runs it for a full week while we sit alongside and fix what breaks"], "get": ["A weekly shape derived for your audience, with the reasoning recorded", "A quarter planned and briefed from your belief calendar", "A seeded story bank and a one-question weekly capture routine with a named owner", "The production pipeline running in your own tooling", "An operating document written from the week your team ran it, and a plain statement of what the engine does not cover"], "money": "Throughput goes up and senior hours per piece go down, both measured against a baseline we take in week one. The story bank is the sleeper. It is the single biggest factor in whether AI search results cite you.", "idx": 21}, "copy-depth-workshop": {"t": "t3", "type": "N", "name": "Copy Depth Workshop", "time": "3 days", "who": "Content team", "promise": "Teach your writers to layer, then republish twenty existing pieces in the same three days.", "problem": "The content is correct, complete, and easy to scroll past. Every piece answers its question, gets skimmed, and gets forgotten, because it opens with the answer and gives the reader no reason to stay. Your writers are doing what corporate writing taught them: lead with the conclusion and do not waste anyone's time.", "cost": "Distribution has to work harder than it should. A paid problem created by an unpaid one. And your existing library is dormant capital: hundreds of pieces that were expensive to produce and are doing nothing.", "hard": "The change that produces the most result is the one that produces the most resistance: moving the answer to the end. That is correct advice for a memo to somebody who has to act. It is wrong for a feed where the reader has not yet decided to care. The argument has to be had in the room rather than deferred. A team that was told applies it badly. A team that argued it applies it properly.", "work": ["We teach the seven persuasive elements on your own published work, counting layers rather than passing judgment", "We rebuild one of your pieces live, then run the argument about moving the answer to the end", "Three alternative structures, with a rule for choosing between them based on how aware the reader is", "Your writers rework and republish twenty existing pieces with us alongside, in a single supervised day", "We write a minimum standard into your process, with a check that is a count rather than a judgment"], "get": ["The seven-layer checklist, usable in under two minutes per piece", "Three remix structures with the selection rule", "Twenty republished pieces, reworked by your own writers", "A three-layer floor written into your content standard, with an enforceable check", "A measurement baseline so the effect can be read in a month"], "money": "It is the fastest content result available, because it works on material that already exists. Take a published piece, find its single layer, add one ingredient, republish. That is a same-week result.", "idx": 22}, "ai-image-system": {"t": "t3", "type": "C", "name": "AI Image System", "time": "1 week", "who": "Brand, design", "promise": "A visual identity specific enough that anyone on your team can generate on-brand images, so design stops being a waiting line.", "problem": "Every image looks like it came from a different company. Your brand guidelines cover the logo, palette and typefaces, and say nothing about what a generated image should look like, because they were written before anyone could generate one. Each person making an image makes a different call. The design team becomes a waiting line.", "cost": "When only the design team can produce something on brand, every piece of content waits for them. That wait sets the pace of the whole function. And visual recognition never accumulates, so every impression starts from zero.", "hard": "Naming a visual identity in terms a tool can act on is harder than it sounds. The first three attempts are always adjectives that could describe any company. The test is generative. The identity that produces recognizably distinctive output is the right one. There is also a palette check that rarely gets run, and it regularly shows that some brand colors make the company's own people look washed out.", "work": ["We name the identity as an era, a feeling and an aesthetic, then test candidates by generating against them", "We test your palette against real photographs of your real people, and produce a rule about which colors stay away from faces", "A prompt library organized by the formats you make, built for selection rather than composition", "A one-page table of fixes for the failures that waste the most time: drifting faces, plastic skin, unwanted text", "Your team generates real images for real upcoming content with us alongside", "Model choice routed by asset type on quality and cost together, with a review date, because a routing choice made today is wrong within a quarter"], "get": ["A named visual identity with the test outputs that justified it", "Palette rules including the face rule, and aspect ratios by destination", "A prompt formula and a selectable library", "The fix table, on one page", "A style guide, and a boundary agreed with your design lead about what still comes to them", "A routing table by asset type, with the date it gets reviewed"], "money": "It removes the routine queue in front of your design team, which is usually the constraint on how fast the whole content function can move.", "gate": "**Every image model named in this engagement will be wrong within a year.** The review cadence is part of the engagement, not an upsell, and we will not build the library without it.", "idx": 23}, "ai-video-voice-system": {"t": "t3", "type": "C", "name": "AI Video and Voice System", "time": "2 weeks", "who": "Content, communications", "promise": "Bring the cost of a video down far enough to publish weekly, and stop generated video from looking fake.", "problem": "Video costs too much per piece to do weekly. Every one is a small production, so video gets saved for launches and events, which means the format that holds attention best is the one you use least. The team tried generative video and found tools that impress in a demo and look slightly wrong in production.", "cost": "Your best explanations stay unrecorded. The person who explains the thing well does it live, on calls, over and over. And the formats with the cheapest attention are exactly the ones a production-scale process cannot feed.", "hard": "Two things. A video with no route into a conversation has done half a job. That is a structural failure rather than a production one, and it has nothing to do with quality. Second, generated video reads as fake for a specific and fixable reason. Teams that skip the three-minute fix produce the uncanny output that gets a whole program vetoed.", "work": ["We start with strategy: which formats you will sustain and what belief each installs. One required field: what conversation each starts, and who picks it up", "Three s and stopped the way these things stop: one skipped week that never restarted.", "cost": "You are renting attention while you already own some. A list that hears from you only when you want something stops opening, and reactivating it later costs more than maintaining it would have. Meanwhile campaign emails underperform for structural reasons that are entirely fixable.", "hard": "Newsletters die from depending on somebody having a clear afternoon. Ideas are never the shortage. The routine has to be designed around that constraint, and the row nobody ever writes down is what happens in a week when it cannot be written. That single missing rule turns one skipped week into a canceled newsletter.", "work": ["If the sending domain is new, or the list has gone cold, we warm it before the first issue: dedicated sending subdomains, five hundred on day one, five hundred on day two, gradual increases as reputation establishes", "Where SMS is in the plan, the messaging registration is prepared before it is submitted: separate promotional and service consent boxes, live Terms and Privacy pages linked inside the forms, no conflicting chat widget on a form page", "We subscribe to your own list and record what a new subscriber receives, which routinely surfaces sequences naming products you retired", "We build a six-rule standard with your writers on your own recent emails, not on examples", "We design the production routine around the constraint that killed the last one, including the missed-week rule", "The first issue is written with your owner rather than for them", "We fix the stale sequences we found and rewrite your last campaign against the standard"], "get": ["The newsletter live, with a template, measurement and a named owner", "A production routine: owner, fixed slot, inputs, length, missed-week behavior", "A quarter of issues planned from your belief calendar", "A one-page email standard attached to your review check", "The sequence audit, with the stale items fixed"  currently published, which is usually nowhere. Authority does not require a title", "We build a fixed set of fifteen questions with you across brand, category and the problems buyers describe before they know you exist", "We record verbatim what each major assistant currently returns, including who is named instead of you", "A long-form structure built on the specific evidence and stories inside your business, rather than category explanation anyone could write", "The publishing routine attaches to your existing content pipeline rather than adding a separate workload", "Every month we re-run the same fifteen queries and report before and after, per query", "Three content anchors for the year, as themes rather than ideas, so the publishing routine has a spine", "Where organic traffic has fallen, we read the Search Console tell before anything else: rankings stable, impressions up, clicks falling is citation displacement, not a technical fault. Then we separate the traffic that left from the traffic that converted, because informational queries now answered in the overview were never going to convert, and we shift the measure to brand mentions across the web rather than backlink counts", "We request indexing in Search Console for every page that carries one of your answers, so the baseline is taken against pages the engines have actually read, and we confirm the two-to-three-day recrawl afterwards"], "get": ["The query set and a dated verbatim baseline", "The competitor picture: who gets named instead of you, and in what terms", "A long-form structure with two pieces built to it", "The audit method, runnable by your team without us", "Monthly reports with what moved, what did not, and what to publish next", "The proof inventory with each item's current visibility, and three content anchors for twelve months", "A diagnosis of what your traffic drop actually was, where there was one, with the Search Console tell shown rather than asserted", "The conversation for the morning the traffic report looks bad, scripted in four lines: the drop is industry-wide and not our failure, the traffic lost was mostly people who were never going to buy, we are moving from chasing rankings to earning citations, and here is the new scorecard"], "money": "The measurement is the part that rarely gets built, and it is what makes the program defensible. You will know your position monthly, which is more than your competitors have.", "gate": "**We will not promise a citation position.** These systems are nondeterministic. The same query returns materially different answers hours apart, so the monthly is sold as measurement and compliance, never as a placement. The baseline is taken logged out, because a signed-in account personalises its own answers and will tell you what you want to hear. The scorecard that replaces sessions and rankings has three lines: branded versus non-branded split, citation footprint, and branded search volume trend.", "idx": 26}, "creative-concept-set": {"t": "t3", "type": "A", "name": "The Creative Concept Set", "time": "2 weeks", "who": "Head of growth, creative lead", "promise": "Six genuinely distinct creative concepts, built so the platform reads them as different rather than as variants.", "problem": "Testing produces variations: a new headline, a different background, another cut. The account fills up and the learning rate does not move.", "cost": "The platform recognises a swapped headline or a recoloured background as the same creative, so a test budget spread across variants buys you one result at the price of twenty. The account looks busy and learns nothing.", "hard": "Separating a message from its dressing, which a team inside the account cannot reliably do about its own work. The distinction has to come from outside or it does not come.", "work": ["Audit what is actually in the account: how many distinct messages sit behind the asset count.", "Build against the six concepts as six different conversations rather than bout where retention belongs, and it has consequences for at least one job description.", "work": ["We start with a measured week of where leadership time goes, rather than a recalled one", "Three things the leadership group tracks daily, chosen by them, plus a thirty-minute weekly reflection", "Your client journey becomes an operating document with every stage owned by a named person", "We settle where retention sits, which is a real decision rather than an implicit one", "One rule applied to the backend: any task done more than twice deserves a system. Your three highest-value processes documented"], "get": ["The three-pillar sheet: the whole operation on one page", "A leadership discipline and a scheduled weekly reflection", "A documented client journey with one leak fixed and the retention decision recorded", "The documentation backlog: every twice-done task, by function", "An operations manual skeleton populated with what already exists, plus three documented processes"], "money": "It is the difference between a business that grows past its founders and one that does not. The weekly reflection sounds soft, and it is the only recurring slot where anybody notices a system has stopped being used.", "idx": 28}, "process-capture": {"t": "t4", "type": "A", "name": "Process Capture", "time": "2 weeks", "who": "Operations, enablement", "promise": "Document ten to twenty processes in two weeks by recording people doing the work instead of asking them to write it up.", "problem": "Documentation never gets written because writing it is the worst job in the building. It has been on the plan for two years. Everyone agrees it matters. Every attempt produced three excellent documents from one conscientious person and then stopped. The people who could write the best documentation have the least time, and that is no coincidence.", "cost": "Nothing can be delegated, because work that exists only as behavior cannot be handed to a new person. Nothing can be automated, because you
