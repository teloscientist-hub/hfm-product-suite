<style>
:root{
  --ground:#FDFDFD;
  --surface:#FFFFFF;
  --card:#F6F3EB;
  --ink:#000000;
  --body:#5E5A52;
  --rule:#E4DFD3;
  --deep:#040404;
  --deep-ink:#FFFFFF;
  --deep-body:#B8B2A4;
  --gold:#F9B93E;
  --bronze:#B36F16;
  --amber:#E08E1B;
  --sand:#CDAE6A;
  --stone:#8A857B;
  --charcoal:#3A3631;
  --accent:#F9B93E;
  --accent-ink:#040404;
  --wash:rgba(249,185,62,.07);
  --shell:1180px;
  --text:1px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#040404;
    --surface:#101010;
    --card:#171614;
    --ink:#FFFFFF;
    --body:#B8B2A4;
    --rule:#2A2824;
    --deep:#000000;
    --deep-ink:#FFFFFF;
    --deep-body:#B8B2A4;
  }
}
:root[data-theme="dark"]{
  --ground:#040404;
  --surface:#101010;
  --card:#171614;
  --ink:#FFFFFF;
  --body:#B8B2A4;
  --rule:#2A2824;
  --deep:#000000;
  --deep-ink:#FFFFFF;
  --deep-body:#B8B2A4;
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--body);
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.8;font-weight:400;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{color:var(--ink);margin:0;text-wrap:balance;line-height:1.25;font-weight:600}
p{margin:0}
a{color:inherit}
.shell{max-width:var(--shell);margin:0 auto;padding:0 28px}
.narrow{max-width:760px}

/* ---------- nav ---------- */
header.top{
  position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--ground) 92%,transparent);
  backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid var(--rule);
}
.topin{max-width:var(--shell);margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:26px}
.mark{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);text-decoration:none;line-height:1.3;white-space:nowrap}.mark .logo{height:34px;width:auto;display:block}.flogo{display:block;width:180px;height:auto;background:#040404;padding:14px 18px;border-radius:5px;margin:0 0 14px}
.mark span{color:var(--gold)}
.navlinks{margin-left:auto;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.navlinks a{font-size:14px;text-decoration:none;color:var(--body);white-space:nowrap}
.navlinks a:hover,.navlinks a.on{color:var(--ink)}
.tglbtn{border:1px solid var(--rule);background:none;color:var(--body);font:inherit;font-size:12px;
  border-radius:999px;padding:5px 12px;cursor:pointer}
.tglbtn:hover{color:var(--ink)}

/* ---------- buttons ---------- */
.btn{display:inline-block;background:var(--gold);color:#040404;text-decoration:none;font-size:16px;font-weight:400;
  border-radius:10px;padding:15px 30px;border:none;cursor:pointer;font-family:inherit;line-height:1.4}
.btn:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);color:#040404}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--rule)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);filter:none}
.btnrow{display:flex;gap:14px;flex-wrap:wrap;align-items:center}

/* ---------- type roles ---------- */
.eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--accent);margin:0 0 14px}
.h-hero{font-size:clamp(32px,5.2vw,54px);font-weight:700;letter-spacing:-.015em}
.h-sec{font-size:clamp(24px,3vw,34px);font-weight:600;letter-spacing:-.01em}
.h-sub{font-size:20px;font-weight:600}
.lede{font-size:clamp(18px,2.1vw,21px);line-height:1.75;color:var(--body);font-weight:400}
.small{font-size:14px;line-height:1.7}
.stack>*+*{margin-top:18px}

/* ---------- sections ---------- */
section{padding:76px 0}
section.tight{padding:52px 0}
.band{background:var(--surface);border-block:1px solid var(--rule)}
.dark{background:var(--deep);color:var(--deep-body)}
.dark h1,.dark h2,.dark h3,.dark h4{color:var(--deep-ink)}

/* ---------- hero : split, text left, art right (matches hfm) ---------- */
.hero{padding:70px 0 60px;position:relative;overflow:hidden}
.hero .rule{width:64px;height:4px;background:var(--accent);border-radius:2px;margin:0 0 26px}
.heroGrid{display:grid;grid-template-columns:minmax(0,635px) minmax(0,430px);gap:44px;align-items:center}
@media(max-width:1020px){.heroGrid{grid-template-columns:1fr;gap:34px;align-items:start}}
.heroArt{width:100%;max-width:430px;justify-self:end}
@media(max-width:1020px){.heroArt{max-width:340px;justify-self:start}}
.heroFacts{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:52px;
  border-top:1px solid var(--rule);padding-top:26px}
@media(max-width:700px){.heroFacts{grid-template-columns:1fr;gap:18px}}
.fact b{display:block;color:var(--ink);font-size:26px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.fact span{font-size:13.5px;line-height:1.6;display:block}

/* ---------- tier cards : icon on top, hfm card geometry ---------- */
.tiergrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:20px}
.tcard{background:var(--card);border-radius:5px;padding:30px 10px 26px 30px;
  text-decoration:none;display:flex;flex-direction:column;gap:11px;position:relative;
  transition:transform .16s ease,background .16s ease}
.tcard:hover{transform:translateY(-4px)}
.tcard .ic{width:120px;height:120px;margin-bottom:6px;display:block}
.tcard .tnum{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--body);font-variant-numeric:tabular-nums}
.tcard h3{font-size:20px;font-weight:600;color:var(--tc);padding-right:20px}
.tcard p{font-size:15px;line-height:1.7;padding-right:20px}
.tcard .cnt{margin-top:auto;padding-top:14px;font-size:13px;color:var(--tc);font-weight:500}

/* ---------- solution cards ---------- */
.solgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.scard{background:var(--card);border:1px solid var(--rule);border-radius:5px;padding:24px 22px;
  text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:border-color .16s ease,transform .16s ease}
.scard:hover{border-color:var(--accent);transform:translateY(-2px)}
.scard .sn{font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--accent);font-variant-numeric:tabular-nums}
.scard h4{font-size:17px;font-weight:600}
.scard p{font-size:14.5px;line-height:1.65}
.scard .meta{margin-top:auto;padding-top:10px;font-size:12.5px;border-top:1px solid var(--rule);
  display:flex;gap:10px;flex-wrap:wrap;color:var(--body)}

/* ---------- steps : hanging number, hfm's 100px left offset ---------- */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:34px 30px}
.step{position:relative;padding:10px 20px 10px 100px;min-height:96px}
.step .n{position:absolute;left:0;top:2px;font-size:44px;font-weight:700;line-height:1;
  color:var(--stepc,var(--gold));font-variant-numeric:tabular-nums;opacity:.9}
.step .n::after{content:".";}
.step h4{font-size:18px;margin-bottom:8px}
.step p{font-size:14.5px;line-height:1.7}

/* ---------- prose blocks ---------- */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:60px}
@media(max-width:820px){.two{grid-template-columns:1fr;gap:32px}}
.deck{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.pt h4{font-size:17px;margin-bottom:7px}
.pt p{font-size:14.5px;line-height:1.7}
.pt{border-top:2px solid var(--accent);padding-top:16px}

ul.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
ul.ticks li{padding-left:26px;position:relative;font-size:15px;line-height:1.7}
ul.ticks li::before{content:"";position:absolute;left:0;top:.62em;width:9px;height:9px;border-radius:2px;background:var(--accent)}

.quote{border-left:3px solid var(--accent);padding:2px 0 2px 24px;font-size:17px;line-height:1.75;color:var(--ink);font-weight:500}
.quote cite{display:block;margin-top:12px;font-size:13.5px;font-style:normal;font-weight:400;color:var(--body)}

.vbar{background:var(--deep);color:#fff;font-size:12.5px;padding:8px 0;text-align:center;letter-spacing:.02em}
.vbar a{color:#fff;text-decoration:underline;text-underline-offset:2px}
.vbar b{font-weight:600}
.band-line{font-size:15px;margin-top:18px;color:var(--body)}
.band-line b{color:var(--ink);font-weight:600}
.devtag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;
  padding:2px 8px;border-radius:999px;background:var(--rule);color:var(--body)}
.pill{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
  padding:5px 11px;border-radius:999px;background:var(--wash);color:var(--accent)}

/* ---------- breadcrumb ---------- */
.crumb{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.crumb a{text-decoration:none;color:var(--body)}
.crumb a:hover{color:var(--accent)}
.crumb .sep{opacity:.5}

/* ---------- cta band ---------- */
.ctaband{background:var(--deep);color:var(--deep-body);padding:64px 0}
.ctaband h2{color:#fff;margin-bottom:14px}
.ctaband p{max-width:620px}
.ctaband .btnrow{margin-top:28px}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--rule);padding:44px 0 56px;font-size:13.5px}
.fgrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:36px}
@media(max-width:760px){.fgrid{grid-template-columns:1fr;gap:26px}}
footer a{display:block;text-decoration:none;color:var(--body);padding:3px 0}
footer a:hover{color:var(--accent)}
footer h5{color:var(--ink);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 10px;font-weight:600}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:420px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
th{color:var(--ink);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}

:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
.chain{display:grid;gap:0;margin:0}
.chainrow{display:grid;grid-template-columns:92px minmax(0,1fr);gap:24px;padding:22px 0;border-top:1px solid var(--rule);align-items:start}
.chainrow:last-child{border-bottom:1px solid var(--rule)}
.chainrow .sn2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--sc);padding-top:5px}
.chainrow h3{font-size:20px;font-weight:600;margin-bottom:6px}
.chainrow h3 a{text-decoration:none}
.chainrow h3 a:hover{color:var(--sc)}
.chainrow p{font-size:15px;line-height:1.7}
.chainrow .cnt2{margin-top:9px;font-size:13px;color:var(--sc);font-weight:500}
@media(max-width:660px){.chainrow{grid-template-columns:1fr;gap:8px}}
.gate{background:var(--wash);border-left:3px solid var(--accent);padding:18px 22px;border-radius:0 5px 5px 0;font-size:15px;line-height:1.75}
.gate b{color:var(--ink)}
.countbar{display:flex;gap:34px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:22px;margin-top:34px}
.countbar div b{display:block;color:var(--ink);font-size:26px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.countbar div span{font-size:13.5px}
.nope{border:1px solid var(--rule);border-radius:5px;padding:22px 24px;background:var(--card)}
.nope h4{font-size:16px;margin-bottom:7px}
.nope p{font-size:14.5px;line-height:1.7}
.srail{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.srail a{font-size:12.5px;text-decoration:none;padding:5px 12px;border-radius:999px;border:1px solid var(--rule);color:var(--body);white-space:nowrap}
.srail a:hover{border-color:var(--accent);color:var(--accent)}
.srail a.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media(max-width:820px){
  .topin{flex-wrap:wrap;gap:10px 18px;padding:12px 20px}
  .navlinks{margin-left:0;width:100%;gap:12px 16px;row-gap:8px}
  .navlinks a{font-size:13px}
  .mark{font-size:14px}
}
@media(max-width:540px){
  .shell{padding:0 20px}
  .countbar{gap:20px}
}
html,body{overflow-x:hidden}
</style>

<style>
/* ---------- v4 additions : AI dependency typing ---------- */
.tbadge{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;line-height:1.6}
.tbadge .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.t-C{color:#F9B93E}
.t-A{color:#B36F16}
.t-N{color:#8A857B}
:root[data-theme="dark"] .t-N{color:#A9A49A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-N{color:#A9A49A}}
.filter{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 24px}
.filter a{font-size:12.5px;text-decoration:none;padding:6px 13px;border-radius:999px;border:1px solid var(--rule);
  color:var(--body);white-space:nowrap}
.filter a:hover{border-color:var(--ink);color:var(--ink)}
.filter a.on{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.filter span.lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--body);margin-right:4px}
.xtab{width:100%;border-collapse:collapse;font-size:14.5px;min-width:520px}
.xtab th,.xtab td{padding:11px 12px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:middle}
.xtab th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);font-weight:600}
.xtab td.num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);text-align:center;width:74px}
.xtab td.zero{color:var(--body);font-weight:400;opacity:.45}
.xtab tr.tot td{border-bottom:none;border-top:2px solid var(--rule);padding-top:14px}
.bar{display:flex;height:12px;border-radius:3px;overflow:hidden;min-width:120px;background:var(--rule)}
.bar i{display:block;height:100%}
.typecard{border:1px solid var(--rule);border-radius:5px;padding:26px 24px;background:var(--card);display:flex;flex-direction:column;gap:10px}
.typecard .big{font-size:40px;font-weight:700;line-height:1;color:var(--tc);font-variant-numeric:tabular-nums}
.typecard h3{font-size:19px}
.typecard p{font-size:14.5px;line-height:1.7}
.typecard .test{font-size:13px;border-top:1px solid var(--rule);padding-top:12px;margin-top:auto;color:var(--body)}
.scard .badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:-2px}
.ladder{display:grid;grid-template-columns:1fr 1fr;gap:40px}
@media(max-width:820px){.ladder{grid-template-columns:1fr;gap:26px}}
.rung{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:4px;margin-bottom:6px;font-size:14px}
.rung b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.75;min-width:26px}
.note{font-size:13.5px;line-height:1.75;border-left:2px solid var(--rule);padding-left:16px;color:var(--body)}
.gapbox{border:1px dashed var(--rule);border-radius:5px;padding:22px 24px;background:none}
.gapbox h4{font-size:16px;margin-bottom:7px}
.gapbox p{font-size:14.5px;line-height:1.7}
.gapbox .pillg{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  padding:3px 9px;border-radius:999px;border:1px solid var(--rule);color:var(--body);margin-bottom:10px}
@media(max-width:820px){
  .topin{flex-wrap:wrap;gap:10px 18px;padding:12px 20px}
  .navlinks{margin-left:0;width:100%;gap:12px 16px;row-gap:8px}
  .navlinks a{font-size:13px}
  .mark{font-size:14px}
}
@media(max-width:540px){.shell{padding:0 20px}.countbar{gap:20px}}
html,body{overflow-x:hidden}
</style>

 the same client for the same reason, and not one of them fixes it. The reason is that the client cannot say which of their last twenty assets performed. We fix that and charge for it, rather than walking away or absorbing it unpriced inside somebody else's phase one.", "why": [{"h": "The most common reason to walk away", "p": "If nobody can say what worked, there is no validated winner to multiply, no signal to select on and nothing for a correction loop to run against. Every tier above this one collapses on the same fact."}, {"h": "Nothing in this tier is an AI system", "p": "Three of the five are architecture and measurement work that predates the models by decades. That is deliberate. It is the part of the menu you can buy before deciding anything about AI."}, {"h": "It makes the price arithmetic instead of posture", "p": "Once the unit economics are on the table, every engagement above can be priced against a number you produced rather than a number we asserted."}], "how": "Census first, then the uncomfortable question, then the fix with an owner on it. The substrate and retrieval work both end in a deletion decision, which is the phase clients resist and the one that makes the rest hold.", "units": ["unit-economics", "winner-id", "substrate-audit", "retrieval-fix", "test-prioritisation"]}, {"id": "t2", "short": "Judgment", "n": "Tier 2", "name": "Judgment capture", "c": "var(--gold)", "hex": "#F9B93E", "tag": "One person's taste, turned into something somebody else can run", "promise": "Take the standard that lives in one person's head and make it run without them, then keep it from drifting back to the average.", "lede": "This is the only tier with no competitor equivalent, and it is the reason to read this site at all. Five engagements, every one of them an AI system, that between them capture what a good output looks like, judge against it before a human sees a draft, add back the things rules cannot add, and correct the whole thing on a schedule.", "why": [{"h": "Rules are subtractive and subtraction has a floor", "p": "A rules file tells the model what not to do. It never adds anything back. Past a certain point you stop getting better writing and start getting shorter writing, which is why a rules-only approach plateaus and everybody blames the model."}, {"h": "A system that writes like a person is never finished", "p": "Leave anything running long enough and it drifts back toward the generic average. That is not a bug to be fixed once. It is the reason the correction loop is a retainer rather than a phase."}, {"h": "The expert is the bottleneck and cannot be interviewed out of it", "p": "Asking an expert for their rules produces a document nobody can run. Capturing them correcting real work produces an asset. The two look similar and only one of them works."}], "how": "We capture corrections to real work rather than asking anyone to describe their standard. Twenty artifacts that need fixing, the expert present, the reasoning recorded as the change is made. Then a judge grades before a human reads anything, and a different model writes than the one that judges.", "units": ["taste-file", "correction-capture", "rules-judge", "voice-engine", "correction-loop"]}, {"id": "t3", "short": "Production", "n": "Tier 3", "name": "Production at volume", "c": "var(--sand)", "hex": "#CDAE6A", "tag": "Assets made in quantity, with the judge attached", "promise": "Produce at a volume that would need a team, without the output converging on itself.", "lede": "Seven engagements, built inside an operation running enormous paid-media volume. This is the largest part of the source material and the narrowest fit: it assumes you have an ad account, a feedback loop and enough spend that a hit rate means something. We say so on every page in this tier rather than finding out in week two.", "why": [{"h": "Nothing here ships without the judge", "p": "Volume without a grading step is how something wrong reaches four hundred assets before anyone notices. Every engagement in this tier carries the Tier 2 judge or we do not sell it."}, {"h": "The hit rate goes in the proposal", "p": "Most of what gets made will not work. Said at the point of sale, month two reads as the method working. Discovered in month two, it reads as the method failing."}, {"h": "Creative is not the only variable", "p": "The one measured ledger in this material shows the same asset producing the best and the worst result six weeks apart on different lists. List and timing move the number as much as the making does."}], "how": "Find the validated winner, vary one axis at a time in cost order, and separate the idea from its dressing until the team can do it unaided. The exploitation ratio is usually one to three, and the message count behind two hundred assets is usually three to five.", "units": ["hook-engine", "static-system", "ai-video", "narrative-ads", "template-library", "multiplication", "funnel-pages"]}, {"id": "t4", "short": "Infrastructure", "n": "Tier 4", "name": "Infrastructure and enforcement", "c": "var(--bronze)", "hex": "#B36F16", "tag": "What you run after we leave, and what stops it going wrong", "promise": "Where the systems live, who owns each one, and the check that fires before anything reaches a customer.", "lede": "Six engagements in two halves that do not resemble each other. Three are AI infrastructure and they age fastest of anything on this site. Three are enforcement, and they are indifferent to which model is current: a standard checked at delivery rather than at review, a claims gate, and a written decision about what the business will say.", "why": [{"h": "A standard nothing enforces is a document somebody read once", "p": "Every rule stated and never checked becomes a preference. The fix is not a better rule. It is a check that runs at the moment of delivery, where nobody has the option of being busy."}, {"h": "Packaging fails, not craft", "p": "We have four shipped skill packages from a competent competitor, all failing version, date and attribution while the work inside them is good. That is the normal failure and it is entirely preventable."}, {"h": "Volume multiplied and the decision did not", "p": "Output went up tenfold and nobody decided what the business would and would not claim. One unexamined framing is now in four hundred assets and no one approved it."}], "how": "Enforcement goes where the cost jumps rather than where the process looks tidy. Where there is a pipeline the check is a rule in the judge. Where the work is human it is a named gate with a person's name on it.", "units": ["skill-authoring", "agent-context", "production-stack", "standards-ladder", "claims-check", "premise-ledger"]}, {"id": "t5", "short": "Commercial", "n": "Tier 5", "name": "Commercial practice", "c": "var(--stone)", "hex": "#8A857B", "tag": "A different buyer entirely, and mostly not about AI at all", "promise": "How a business that sells expertise gets clients, prices work, keeps them, and turns what it knows into something it owns.", "lede": "Ten engagements, none of which involve a model at any point. Eight describe how a professional services firm runs itself. Two, the Delivery Ladder and the Proving Ground, are full client engagements for businesses whose material has stopped changing or whose method walks out the door with every client. Do not read this tier as an extension of the five above it. The buyer is different and so is the conversation.", "why": [{"h": "None of it ages", "p": "The outreach template here dates to 2013 and still runs. The referral script, the contract structure and the endorsement method are indifferent to which model is current, which is the whole argument for holding this tier."}, {"h": "We run on most of it ourselves", "p": "Eight of these ten are things a firm adopts rather than sells. We adopted them before putting them on a page, which is a lower bar than it sounds and one almost nobody clears."}, {"h": "Nobody walks in asking for it", "p": "No one requests a contract structure or a referral condition. These get diagnosed, which is why they sit at the bottom of a page rather than the top."}], "how": "Two sessions, five weeks apart, with homework in between. A single session produces a document you agree with and do not act on. A session that sets homework produces a person who has done the thinking and been corrected on it.", "units": ["client-acquisition", "discovery-proposal", "pricing-architecture", "offer-ladder", "onboarding-contracts", "retention-referral", "proof-endorsement", "republication", "delivery-ladder", "proving-ground"]}], "U": {"ceiling-read": {"t": "t0", "type": "C", "name": "The Ceiling Read", "time": "2 days", "who": "CTO, COO, whoever signed for the AI", "promise": "Three constraints measured, one named as binding, and two declined in writing.", "problem": "Output has gone up and results have not. Somebody can tell you the team is producing more than ever, and nobody can tell you whether it is more of the same thing.", "cost": "Money spent on a constraint that was not binding does not fail loudly. It produces a system that works slightly better, a budget that is gone, and a room that concludes AI does not do much here.", "hard": "Three ceilings have twelve measurements between them and none is a matter of opinion. The part you cannot do internally is the refusal: naming one and declining the other two takes somebody with no stake in which answer it is.", "work": ["Platform: a distinctness audit across twenty recent assets counting collisions, when your model of what the channel rewards was last checked against the channel's own statements, the age of each testing habit, and how crowded the slices are that you compete in.", "Retrieval: the author test, where three people are asked to produce a link to something they built more than a month ago and timed. Then utilisation across your libraries, the rebuild rate, and a staleness sample of ten process documents.", "Compute: consumption per unit of work, how many jobs failed or were truncated last quarter for a resource reason rather than a logic one, regime classification per workload, and which steps of your most expensive recurring process actually change the outcome.", "The ranking. One ceiling named as binding with the measurement that establishes it, and the two that are not, each with the trigger that would make it matter later."], "get": ["The Ceiling Report, ranked, with every measurement attached", "One binding constraint named, and what it is currently costing", "Two constraints declined in writing, each with its trigger", "A first action, sized to be started the week after"], "money": "It is paid and it credits in full against whatever follows. A free audit is a sales instrument and everybody in the room knows it, which is exactly why the ranking would not be worth reading.", "gate": "**If your binding ceiling turns out to be compute, we will say so and we do not currently sell the remediation.** The source material specifies that track and we have not built it. You would get the finding, the measurements and an honest referral rather than an engagement.", "idx": 1}, "flatness-audit": {"t": "t0", "type": "C", "name": "The Flatness Audit", "time": "1 hour", "who": "Content lead, comms, whoever owns the prompt", "promise": "Four measurements on your own AI output that end the better-prompts conversation in about a minute.", "problem": "The output is fine and it is flat. Everything it produces sounds like everything else it produces, and the current theory in the room is that the prompt needs more work.", "cost": "The better-prompts theory is expensive because it is nearly free to hold. Teams spend quarters refining instructions against a ceiling that instructions cannot move, and the usual end state is that the tool gets abandoned for anything customer-facing.", "hard": "Three of the four measurements are counter-intuitive and none of them is about quality. They are about where words went, how much instruction there is relative to example, and where in each output the interesting sentence landed.", "work": ["You bring three things: the prompt you actually use, ten recent outputs from it, and the three best pieces a human on your team has written.", "Weighting. Name the most important point in an output, then count the words spent on it against the words spent on the least important. These come out roughly equal, and the least important often gets more.", "Rule-to-example ratio. Words of instruction against words of example in your prompt. It is usually ninety to ten the wrong way, and frequently there are no examples at all.", "Convergence. We run your prompt four times and line the outputs up next to each other. This is the measurement that ends the conversation.", "Buried lead. Where in each output the most interesting sentence sits. Consistently the middle."], "get": ["Four numbers on your own output, taken in front of you", "The convergence sheet, four runs side by side", "Your rule-to-example ratio, and what it would need to be", "A written statement of which of the six defects you actually have"], "money": "One hour, and it is the cheapest thing on this site. It exists to make the next decision obvious rather than to be a project.", "gate": "**This presupposes a text-production problem.** If the Ceiling Read names something else as binding, this is the wrong first engagement and we will say so.", "idx": 2}, "diversity-decoder": {"t": "t0", "type": "A", "name": "The Creative Diversity Decoder", "time": "3 days", "who": "Head of growth, media buyer", "promise": "How many actual messages are behind your two hundred assets, as a number.", "problem": "The account has a lot of creative in it. Nobody can say how much of that is genuinely different from the rest, or which claims the account has never tested at all.", "cost": "An account with five messages behind two hundred assets is paying production costs for variation it is not getting. The test budget is spread across things that are the same argument in different clothes, so the learning rate is a fraction of what the spend implies.", "hard": "Separating a message from its format is a skill, and a team that has been inside the account cannot do it about their own work. The distinction has to come from outside or it does not come.", "work": ["Pull the asset set with its performance data attached.", "Classify each asset by the message underneath it rather than by format, offer or audience.", "Count. The ratio of assets to distinct messages is the finding, and it is usually three to five messages behind two hundred assets.", "Name the messages that are absent: the claims your category makes that this account has never put in front of anyone."], "get": ["The message count, and the asset-to-message ratio", "Every asset mapped to the message underneath it", "The list of messages the account has never tested", "The separation method, taught until your team does it unaided"], "money": "The ratio is the entire sale for the Multiplication Engine. If it comes back at three messages behind two hundred assets, the next engagement argues itself.", "gate": "**Needs an ad account with enough history to read.** Fewer than about fifty assets and the count is not a finding, it is an observation.", "idx": 3}, "failure-audit": {"t": "t0", "type": "N", "name": "The Failure Audit", "time": "3 days", "who": "Finance, head of growth", "promise": "What share of your spend went into assets that lost money, and whether the thing you run most is one of them.", "problem": "Spend is going out and the reporting is about the winners. Nobody has asked the inverse question: how concentrated are the losses, and is the most-used asset in the account actually one of them.", "cost": "Loser concentration is invisible in average reporting. An account can look acceptable in aggregate while the majority of the money goes into things that lost, and the single most-deployed asset can be a loser nobody has flagged because it is familiar.", "hard": "Nothing here is technically difficult and almost nobody does it, because it requires asking a question whose answer is embarrassing. The value is in somebody from outside asking it.", "work": ["Take the client's own performance ledger, whatever form it is in.", "Price every asset or drop that can be priced, and sort by outcome rather than by volume.", "Compute loser concentration: what share of total spend went into assets that lost money.", "Run the most-run-asset check. Find the thing deployed most often and look up its result."], "get": ["Loser concentration as a percentage of total spend", "The concentration curve, ranked", "The most-run-asset check, answered", "A deletion list, with what to stop running this month"], "money": "Priced against what it stops. The reference case is a ledger of 1,353 drops carrying $2,700,366 of spend at a 2% return, where 63% of the money went into losers and the most-deployed creative in the file was one of them, run 82 times for minus 7%.", "gate": "**This disqualifies more clients than anything else in Tier 0.** It needs performance data that actually exists. If you cannot produce it, the honest next step is Winner Identification, not this.", "idx": 4}, "unit-economics": {"t": "t1", "type": "N", "name": "Unit Economics Read", "time": "1 week", "who": "Founder, finance", "promise": "CPA, AOV, COGS, gross margin and LTV on one sheet, with the lever list under each.", "problem": "Decisions about what to spend and what to charge are being made on feel. When somebody asks what a point of improvement is worth, the answer is a shrug or an argument.", "cost": "Without this, every proposal you receive from anyone, including us, is priced against an assertion rather than against your own arithmetic. It is also why improvement projects get funded by enthusiasm and defunded by the first quiet quarter.", "hard": "The arithmetic is straightforward and the inputs are scattered across three systems and two people's heads. The work is the assembly and the honesty about which numbers are estimates.", "work": ["Assemble the five: cost per acquisition, average order value, cost of goods, gross margin, lifetime value. Mark which are measured and which are estimated.", "Name the four goals and put the lever list under each, so that improving a number has a named set of actions rather than an intention.", "Answer the four qualifying questions, which establish in one conversation whether the business can measure at all.", "Compute what one point of improvement is worth, in money, so every later proposal can be priced against it."], "get": ["The economics sheet, with estimates marked as estimates", "Four goals with their levers listed", "What one point is worth, as a number", "The four questions, answered, as a standing qualifier"], "money": "This is the instrument that turns pricing from a posture into arithmetic you check yourself. The worked example in the source takes a funnel from minus $146 per customer to plus $56.18 through three changes, none of them a new advert.", "gate": "**We do not have category benchmarks and will not pretend to.** This tells you what your numbers are and what the levers are. It does not tell you whether your numbers are good compared to your competitors, because that data is scarce and mostly anecdotal.", "idx": 5}, "winner-id": {"t": "t1", "type": "A", "name": "Winner Identification Install", "time": "2 weeks", "who": "Marketing ops, analytics", "promise": "The measurement fix, so that the sentence blocking every other engagement stops being true.", "problem": "Asked which of the last twenty things you published performed, the honest answer is that nobody knows. Asked out loud in a meeting, the answer is usually a guess delivered confidently.", "cost": "This one fact disqualifies you from judgment capture, from multiplication, and from anything that needs a feedback loop. It is the most common reason an engagement cannot start, and it is cheaper to fix than to keep working around.", "hard": "The census is easy and the attribution method is where it goes wrong. Most attempts produce a dashboard nobody maintains. The install is only finished when there is a named person whose job includes it.", "work": ["Census the last twenty assets and attach whatever outcome data exists, including where there is none.", "Decide the attribution method, explicitly, including what it cannot see. A method with stated blind spots survives; one that claims completeness does not.", "Install it so the client runs it without us.", "Name the owner and the cadence. Without both, this regresses within two quarters."], "get": ["The twenty-asset census with outcomes attached", "An attribution method documented, including its blind spots", "The running install, operated by your team", "A named owner and a cadence"], "money": "Priced against the engagements it unblocks. Four of the highest-value things on this site cannot be sold to you until this exists.", "gate": "**We say the floor in the first conversation rather than discovering it in phase one.** Below a certain volume, attribution is noise and this engagement is not worth buying.", "idx": 6}, "substrate-audit": {"t": "t1", "type": "A", "name": "The Substrate Audit", "time": "1 paid day, then 5 to 7 weeks", "who": "CTO, IT, ops", "promise": "A map of the tooling estate nobody can currently draw, and the two things in it that are dangerously coupled.", "problem": "Tools accumulated faster than assumptions could be maintained. Process documents reference things you no longer run, every team picked something different, and changing anything feels risky because nobody knows what depends on it.", "cost": "The cost lands on the day a vendor changes, and it lands as a quarter of rewriting rather than a day of switching. The other cost is continuous: decisions deferred because the consequences are unknown.", "hard": "The classification is the intellectual work and it is the part teams cannot do about their own estate. Almost everything in a stack is a tool and is being treated as a pattern, and seeing that requires somebody who did not choose any of it.", "work": ["The layer census. List every tool and classify each as a tool, a pattern, or a piece of judgement. This distinction is the whole audit.", "Coupling depth. For each tool, what breaks if it vanishes on Friday. The deep coupling is usually via state stored inside a vendor's product.", "Documentation staleness. Sample ten process documents and count references to things that no longer exist. Typically a third to a half, and it is checkable in front of you.", "Foundation age. For each foundational choice, when it was last examined. The usual answer is never, since adoption.", "Then remediation: move accumulated state out of vendor products, rewrite every process step to name a capability rather than a product, and install the seven-question adoption gate with somebody who is allowed to say pilot-only."], "get": ["The substrate map: every tool, its layer, its coupling depth, and what dies with it", "State relocated out of vendor products, with a swappable access layer", "The neutralised process set, naming capabilities rather than products", "The adoption gate as a one-page check, with an owner", "A review calendar and a deprecation duty, assigned"], "money": "Priced against switching cost avoided. Ask what your last tool migration cost in time and disruption, then price a fraction of one avoided migration. Most businesses have paid for at least one in the past two years and can name the number.", "gate": "**The usual conclusion is that we did not tell you to re-tool.** Most of the estate is fine and two things are dangerously coupled. An audit that ends in a re-tooling project has made the exact mistake it was hired to prevent.", "idx": 7}, "retrieval-fix": {"t": "t1", "type": "A", "name": "The Retrieval Fix", "time": "3 to 4 weeks", "who": "Chief of staff, ops", "promise": "Findability, ending in a kept set of ten to twenty percent and a person whose job is pruning.", "problem": "The work exists and nobody can find it, so it gets rebuilt. Two people have independently made the same thing this quarter and neither knows.", "cost": "Rebuild cost is the visible half. The invisible half is that nothing compounds: every asset is a one-off because retrieving the previous one costs more than remaking it.", "hard": "The deletion phase. Clients resist it hard, which is exactly how you know it is the part that works. Doing it internally fails because nobody has the authority to throw away a colleague's work.", "work": ["Census and utilisation. Full inventory with usage data attached. Expect a long tail of zeroes.", "Deletion. Keep ten to twenty percent. Everything else is archived rather than destroyed, which is what makes the decision survivable.", "Naming and routing. One convention, and one canonical location per class of thing.", "The maintenance duty. A named owner and a pruning cadence, because without it this regrows in two quarters."], "get": ["The full inventory with usage data", "The kept set, ten to twenty percent, with the rest archived", "A naming convention and one canonical location per class", "A named owner and a pruning cadence"], "money": "Priced against rebuild rate. Ask two of your builders how often they have made something that already existed; they will know, and the number is usually higher than management expects.", "gate": "**The proof for this comes from the people who wrote the source material.** Both of them, in the same week, could not find their own work. One could not locate a file he had shipped six weeks earlier.", "idx": 8}, "test-prioritisation": {"t": "t1", "type": "N", "name": "Test Prioritisation", "time": "3 days", "who": "Growth lead", "promise": "A ranked test backlog, scored on five axes, that survives somebody senior disagreeing with it.", "problem": "There is a list of things worth testing and no defensible order. In practice the order is whoever asked most recently, or whatever is easiest to build.", "cost": "Testing in the wrong order means the cheap high-confidence answers arrive last, after the budget has been spent on the expensive ambiguous ones. The learning rate is set by the ordering, not by the volume.", "hard": "Nothing. This is a scoring rubric and a facilitated session. It is on this site because it is genuinely useful and almost nobody has one.", "work": ["Assemble every proposed test into one list, including the ones that live in someone's notes.", "Score each on five axes: speed to a result, weight of confidence, impact if right, necessity, and growth potential.", "Average and rank. Disagreements now happen about a score rather than about a priority, which is a much shorter argument.", "Hand over the grid as a standing instrument with an owner, so the next twenty tests get ordered the same way."], "get": ["The scored and ranked backlog", "The grid as a standing instrument", "An owner who runs it", "The scoring session, run once with your team so they can repeat it"], "money": "Three days, priced as a facilitated instrument rather than as analysis. It pays back on the first test you do not run.", "gate": "**Without Winner Identification the scores are opinions.** Confidence and impact both require knowing what previous tests actually showed.", "idx": 9}, "taste-file": {"t": "t2", "type": "C", "name": "Taste File and Primer", "time": "1 to 2 weeks", "who": "The bottleneck expert, and their manager", "promise": "Two reference artifacts: what good looks like with the reasons attached, and a primer that is mostly examples.", "problem": "The standard exists in one person's head. New people take months to approximate it, the model never approximates it, and there is no document that would help either.", "cost": "Everything routes through one person for approval. They are the constraint on throughput, they cannot take a holiday without the standard slipping, and the organisation has no plan for the day they leave.", "hard": "The two artifacts are different and get merged, which ruins both. One is a taste file: five to ten pieces with the reason each is good, and the mediocre version of each answered. The other is a primer per task, seventy to ninety percent examples, built from work that performed rather than work people liked.", "work": ["Select five to ten pieces that represent the standard. For each, write down why, and answer what the mediocre version of this would have looked like.", "Build the primer separately, per task, at seventy to ninety percent examples by volume. The ratio is the point: instruction-heavy primers are what produce flat output.", "Source the primer from work that performed rather than work people remember fondly. Record the provenance of every example.", "Set the rule that protects both: neither artifact ever receives anything the pipeline produced."], "get": ["The taste file, five to ten pieces, each with its reason and its mediocre counterpart", "A primer per task at seventy to ninety percent examples", "Provenance recorded for every example", "The corpus hygiene rule, written down and owned"], "money": "Priced against the bottleneck's cost, which is a number you already have. Take what that person is paid, multiply by the share of their week spent reviewing rather than deciding.", "gate": "**The expert must be provably good, with an outcome record.** Capturing the taste of somebody whose results nobody can verify produces a confident system with no basis.", "idx": 10}, "correction-capture": {"t": "t2", "type": "C", "name": "Correction Capture", "time": "2 to 4 weeks live", "who": "The bottleneck expert, present in the room", "promise": "Twenty artifacts corrected live, captured as before, after and the reasoning, while the change is being made.", "problem": "The expert can fix anything you put in front of them and cannot tell you the rule they fixed it against. Asked directly, they produce generalities that nobody can apply.", "cost": "Without this the rules file is written from an interview, which produces a document that sounds right and changes nothing. This is the single most common way a judgment pipeline fails, and it fails expensively because everything downstream was built on it.", "hard": "Getting twenty artifacts that need correction rather than twenty good examples is a harder ask than it sounds, and keeping the sessions from drifting into an interview is the entire craft. The expert must do the corrections themselves and must not describe instead of correcting.", "work": ["Assemble twenty artifacts that need correction. Not twenty good examples. This is the harder ask and the one clients try to substitute their way out of.", "Run live correction sessions, six to ten hours a week for two to four weeks, with the expert present and working.", "Capture triples rather than pairs: the before, the after, and the reasoning, recorded as the change is made rather than reconstructed afterwards.", "Build the extraction record alongside, which is the artifact nobody asks for and the one that makes the asset durable.", "Run the promotion test on every candidate rule: check it against artifacts from a different context and kill the ones that do not survive."], "get": ["Twenty correction triples: before, after, reasoning", "The extraction record", "Candidate rules, each already tested against a different context", "The sessions recorded, so the reasoning survives the person"], "money": "Not priced on hours. The value is in one person's twenty hours, and pricing on hours makes the most valuable input on the engagement look like the cheapest line item.", "gate": "**Three conditions or we do not start.** The expert must be provably good with an outcome record. The expert must do the twenty themselves. And there must be enough downstream volume to pay for it.", "idx": 11}, "rules-judge": {"t": "t2", "type": "C", "name": "Rules File and Judge Install", "time":     <h2 class="h-sec">Why this tier exists</h2>
    <div class="deck" style="margin-top:10px">${t.why.map(w=>`<div class="pt" style="border-color:${t.c}"><h4>${esc(w.h)}</h4><p>${esc(w.p)}</p></div>`).join('')}</div>

  </div></section>
  <section><div class="shell stack">
    <h2 class="h-sec">${t.units.length} way${t.units.length>1?'s':''} to work with us here</h2>

      :`<p class="note">Nothing in this tier is ${esc(TYPES[tk].name.toLowerCase())}. That is the finding rather than an empty page. <a href="#/tier/${t.id}">Show all ${t.units.length}</a>.</p>`}

}

function unitPage(u){

  return nav(t.id) + `
  <section class="hero" style="padding-bottom:26px"><div class="shell narrow stack">
    <div class="crumb"><a href="#/">Home</a> <span class="sep">&rsaquo;</span> <a href="#/tier/${t.id}">${esc(t.name)}</a> <span class="sep">&rsaquo;</span> <span>${esc(d.name)}</span></div>
    <div class="rule" style="background:${t.c}"></div>
    <p class="eyebrow" style="color:${t.c}">Engagement ${pad(d.idx)} &middot; ${esc(d.time)} &middot; ${esc(d.who)}</p>
    <h1 class="h-hero">${esc(d.name)}</h1>
    <div class="badges" style="margin:2px 0 4px">${badge(d.type)}</div>
    <p class="lede">${esc(d.promise)}</p>
    <p class="note"><b>${esc(m.name)}.</b> ${esc(m.test)}. What you are buying is ${esc(m.buy.toLowerCase())}. <a href="#/types">Why we label these</a>.</p>
  </div></section>
  <section class="band"><div class="shell narrow stack">
    <h2 class="h-sub">The problem, as you would describe it.</h2><p>${esc(d.problem)}</p>
    <h2 class="h-sub" style="margin-top:30px">Why leaving it is more expensive than fixing it.</h2><p>${esc(d.cost)}</p>
    <h2 class="h-sub" style="margin-top:30px">The part that makes this worth outside help.</h2><p>${esc(d.hard)}</p>
  </div></section>
  <section><div class="shell narrow stack">
    <h2 class="h-sec">The kind of work this is.</h2>
    <div class="steps" style="grid-template-columns:1fr;gap:22px;margin-top:14px">
      ${d.work.map((w,i)=>`<div class="step" style="--stepc:${t.c}"><div class="n">${i+1}</div><p>${esc(w)}</p></div>`).join('')}
    </div>
  </div></section>
  <section class="band"><div class="shell narrow stack">
    <h2 class="h-sec">What you hold at the end</h2>
    <ul class="ticks" style="--accent:${t.c};margin-top:8px">${d.get.map(g=>`<li>${esc(g)}</li>`).join('')}</ul>
    <h2 class="h-sub" style="margin-top:34px">Why this one pays.</h2><p>${esc(d.money)}</p>
    ${d.gate?`<div class="gate" style="margin-top:30px;border-left-color:${t.c}">${md(d.gate)}</div>`:''}
  </div></section>
  ${sibs.length?`<section><div class="shell stack">
    <h2 class="h-sub">What sits alongside it in ${esc(t.name.toLowerCase())}.</h2>
    <div class="solgrid" style="margin-top:12px">${sibs.map(x=>card(x)).join('')}</div>
  </div></section>`:''}` + foot();
}

function typesPage(tk){
  const list = tk ? ORDER.filter(u=>U[u].type===tk) : ORDER;
  const maxr = Math.max(...XT.map(r=>r.tot));
  return nav('types') + `
  <section class="hero" style="padding-bottom:28px"><div class="shell narrow stack">
    <div class="rule"></div><p class="eyebrow">The honest label</p>
    <h1 class="h-hero">How much of this is actually AI.</h1>
    <p class="lede">Every engagement on this site carries one of three labels, decided by what you hold after we leave rather than by what the engagement is about. A title tells you the subject. The deliverable tells you the truth, and those are different facts.</p>
  </div></section>

  <section class="band"><div class="shell stack">
    <div class="deck">
      ${TK.map(k=>{const m=TYPES[k];return `<div class="typecard" style="--tc:${m.hex}">
        <div class="big">${TOT[k]}</div>
        <h3>${esc(m.name)}</h3>
        <p>${esc(m.buy)}.</p>
        <p style="font-size:13.5px"><b style="color:var(--ink)">Who asks for it.</b> ${esc(m.who)}. <b style="color:var(--ink)">Ages:</b> ${esc(m.ages).toLowerCase()}. <b style="color:var(--ink)">Proof we hold:</b> ${esc(m.proof.toLowerCase())}.</p>
        <div class="test"><b>The test.</b> ${esc(m.test)}.</div>
      </div>`}).join('')}
    </div>
    <p class="band-line" style="margin-top:30px"><b>Why publish this at all.</b> Because a service menu written during an AI boom describes almost everything in AI language, and a year later nobody can say which engagements survive the tooling being replaced. Fifteen of these thirty-seven would still be sellable if the models stopped improving tomorrow.</p>
  </div></section>

  <section><div class="shell stack">
    <p class="eyebrow">The cross-tab</p>
    <h2 class="h-sec">The AI is concentrated in two tiers, and absent from two others.</h2>
    <div class="tablewrap" style="margin-top:14px"><table class="xtab">
      <thead><tr><th>Tier</th><th style="text-align:center">AI-centric</th><th style="text-align:center">AI-assisted</th><th style="text-align:center">Not about AI</th><th>Shape</th></tr></thead>
      <tbody>
      ${XT.map(r=>`<tr>
        <td><a href="#/tier/${r.id}" style="text-decoration:none;color:var(--ink);font-weight:600">${esc(r.name)}</a><br><span style="font-size:12.5px">${esc(r.n)} &middot; ${r.tot} engagements</span></td>
        <td class="num ${r.C?'':'zero'}">${r.C}</td>
        <td class="num ${r.A?'':'zero'}">${r.A}</td>
        <td class="num ${r.N?'':'zero'}">${r.N}</td>
        <td><div class="bar" style="width:${Math.round(r.tot/maxr*100)}%">
          ${r.C?`<i style="background:#F9B93E;flex:${r.C}"></i>`:''}
          ${r.A?`<i style="background:#B36F16;flex:${r.A}"></i>`:''}
          ${r.N?`<i style="background:#8A857B;flex:${r.N}"></i>`:''}
        </div></td></tr>`).join('')}
      <tr class="tot"><td><b style="color:var(--ink)">All six tiers</b></td>
        <td class="num">${TOT.C}</td><td class="num">${TOT.A}</td><td class="num">${TOT.N}</td>
        <td><div class="bar"><i style="background:#F9B93E;flex:${TOT.C}"></i><i style="background:#B36F16;flex:${TOT.A}"></i><i style="background:#8A857B;flex:${TOT.N}"></i></div></td></tr>
      </tbody></table></div>
    <div class="two" style="margin-top:38px">
      <div class="stack">
        <h3 class="h-sub">Three readings of that table</h3>
        <ul class="ticks">
          <li><b>Tier 1 is the gate for every AI tier and contains no AI.</b> Five pieces of measurement and estate work, no model in any deliverable. It is the part of this menu you can buy before deciding anything about AI.</li>
          <li><b>Tier 2 is five for five and it is the only tier that is.</b> Judgment capture is the purest AI product here and the one with no competitor equivalent.</li>
          <li><b>Tier 5 is ten for ten in the other direction.</b> The top of the ladder is indifferent to which model is current.</li>
        </ul>
      </div>
      <div class="stack">
        <h3 class="h-sub">And one about the fifteen</h3>
        <p>Ten of the fifteen not-about-AI engagements are in Tier 5, and eight of those describe how a professional services firm runs itself rather than something a client buys. We adopted those before putting them on this page.</p>
        <p class="note" style="margin-top:14px">So the not-about-AI work you can actually buy from us is seven engagements, not fifteen. The number on the card is honest about the library and would be misleading about the shelf, which is why it is said here.</p>
      </div>
    </div>
  </div></section>

  <section class="band"><div class="shell stack">
    <p class="eyebrow">All ${TOT.tot}</p>
    <h2 class="h-sec">The whole catalogue, filtered by label.</h2>
    ${filterbar('#/types',tk)}
    <div class="solgrid">${list.map(u=>card(u)).join('')}</div>
  </div></section>` + foot();
}

function limits(){
  return nav('limits') + `
  <section class="hero" style="padding-bottom:30px"><div class="shell narrow stack">
    <div class="rule"></div><p class="eyebrow">The boundary</p>
    <h1 class="h-hero">What this does not do.</h1>
    <p class="lede">Four things we will refuse, two engagements this material specifies that we have not built, and one honest note about who this was written for. Published because you would find all of it anyway, and later.</p>
  </div></section>

  <section class="band"><div class="shell stack">
    <h2 class="h-sec">Four refusals, in writing</h2>
    <ul class="ticks" style="margin-top:10px">
      <li><b>We will not remediate a ceiling that is not binding.</b> The Ceiling Read names one of three and declines the other two in writing, even where you would pay for all three. The refusal is the only part of an audit worth anything.</li>
      <li><b>We will not bundle the claims work into something larger.</b> Bundled, it is the phase that gets cut. It is sold standing or not at all.</li>
      <li><b>We will not build a judgment pipeline for a client who cannot say which of their last twenty pieces performed.</b> We fix measurement first or we do not start, and that is Tier 1 rather than a favour absorbed into phase one.</li>
      <li><b>We will not sell Tier 2 into an organisation with nobody competent to run the judge.</b> Every process here assumes an operator with judgement. The loops compound only if somebody can tell a good output from a bad one.</li>
    </ul>
  </div></section>

  <section><div class="shell stack">
    <h2 class="h-sec">Two things the source specifies and we have not built</h2>
    <p class="lede narrow">Named rather than hidden, because both are holes a client would hit rather than read about.</p>
    <div class="deck" style="margin-top:20px">
      <div class="gapbox"><span class="pillg">Gap</span><h4>Compute remediation</h4><p>The Ceiling Read measures three ceilings and we can remediate two. If your binding constraint turns out to be compute, you get the finding and an honest referral rather than an engagement. The source specifies the track, including what it calls the best cost idea in the material. We have not built it.</p></div>
      <div class="gapbox"><span class="pillg">Gap</span><h4>Handover and gate</h4><p>The judgment tier is specified with a fifth phase we do not currently sell: teaching the gate and the defect names to the people who ship, and naming a reviewer per task. Without it the pipeline has no owner after we leave, which is the failure the correction loop exists to prevent.</p></div>
    </div>
  </div></section>

  <section class="band"><div class="shell stack">
    <h2 class="h-sec">Who this was written for, and who it was not</h2>
    <div class="two" style="margin-top:10px">
      <div class="stack">
        <p>This material came out of a direct-response operation running very large paid-media volume. That shows most in Tier 3, which assumes an ad account, a feedback loop and enough spend that a hit rate means something. If you do not have those, six of those seven engagements are the wrong purchase and we would rather say so here.</p>
        <p>Tiers 0, 1, 2 and the enforcement half of Tier 4 translate to a much wider range of businesses, because measurement, judgment and a claims boundary are not media problems.</p>
      </div>
      <div class="stack">
        <div class="nope"><h4>The source has no compliance layer, by design</h4><p>Two separate calls in the original material state that its own systems carry no compliance filter at all, and that it is treated as the operator's responsibility. Our position is the opposite. It also means the method we adapted has never been run under the constraint we are adding, and you should know that before you hear it from somebody else.</p></div>
        <div class="nope" style="margin-top:18px"><h4>The proof is uneven and we will tell you where</h4><p>The AI-centric engagements have the weakest evidence: specified, not yet run at a client. The AI-assisted ones have the strongest, including a measured ledger and a 212-case pricing register. Ask which one you are buying.</p></div>
      </div>
    </div>
  </div></section>` + foot();
}

function start(){
  return nav('start') + `
  <section class="hero"><div class="shell narrow stack">
    <div class="rule"></div><p class="eyebrow">Start</p>
    <h1 class="h-hero">Describe the symptom, not the solution.</h1>
    <p class="lede">The first engagement is almost always a diagnostic: two days, or in one case an hour. It is paid, it credits against whatever follows, and it may well end with us telling you that the thing you asked about is not your binding constraint.</p>
    <h2 class="h-sub" style="margin-top:26px">Things people say that we can act on straight away</h2>
    <ul class="ticks" style="margin-top:6px">
      <li>We are using AI and the output all sounds the same.</li>
      <li>We are producing more than ever and the results are flat.</li>
      <li>Nobody can find anything we made more than a month ago.</li>
      <li>Everything routes through one person and they are the constraint.</li>
      <li>We cannot say which of our last twenty pieces performed.</li>
      <li>Something went out that should not have, and we cannot say what would stop the next one.</li>
      <li>We keep solving the same problem for different clients and accumulating nothing.</li>
    </ul>
    <div class="btnrow" style="margin-top:30px"><a class="btn" href="mailto:support@humanfirstmedia.com?subject=Diagnostic">Email us</a><a class="btn ghost" href="#/tier/t0">See the four diagnostics</a></div>
  </div></section>` + foot();
}

function titleFor(h){
  const S='Human First Media';
  if(h.startsWith('/unit/')&&U[h.slice(6)]) return U[h.slice(6)].name+' | '+S;
  if(h.startsWith('/tier/')){const t=byId(h.slice(6).split('/')[0]); if(t) return t.name+' | '+S;}
  if(h.startsWith('/types')) return 'How much of this is AI | '+S;
  if(h==='/limits') return 'What we do not do | '+S;
  if(h==='/start') return 'Start | '+S;
  return S+' | Find out what is true, then build on it';
}

function render(){
  const h=location.hash.replace(/^#/,'')||'/';
  let out;
  if(h==='/'||h==='') out=home();
  else if(h.startsWith('/tier/')){const p=h.slice(6).split('/'); out=tierPage(p[0], p[1]?bySlug(p[1]):null);}
  else if(h.startsWith('/unit/')) out=unitPage(h.slice(6));
  else if(h.startsWith('/types')){const p=h.split('/'); out=typesPage(p[2]?bySlug(p[2]):null);}
  else if(h==='/limits') out=limits();
  else if(h==='/start') out=start();
  else out=home();
  document.getElementById('app').innerHTML=out;
  document.title=titleFor(h);
  window.scrollTo(0,0);
  const t=document.getElementById('tgl');
  if(t) t.onclick=()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const next = cur==='dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem('hfm-theme',next)}catch(e){}
  };
}
try{const s=localStorage.getItem('hfm-theme'); if(s) document.documentElement.setAttribute('data-theme',s);}catch(e){}
addEventListener('hashchange',render);
render();

</script>
